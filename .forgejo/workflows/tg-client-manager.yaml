name: "[main-tg-client-manager] Build and push"

on:
  push:
    branches:
      - main
    paths:
      - '.forgejo/workflows/tg-client-manager.yaml'
      - 'kubernetes/base/tg-client-manager.yaml'
      - 'tg-client-manager/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: kube
    container:
      image: forge.dev.takatan.cloud/takatan/docker-builder:latest
      credentials:
        username: lexus
        password: ${{ secrets.HAJIME_PASSWD }}
    env:
      DOCKER_HOST: tcp://172.18.0.1:2375
      REPO_URL: forge.dev.takatan.cloud
      IMG: forge.dev.takatan.cloud/lexus/voicemsg-net
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build -f tg-client-manager/Dockerfile -t ${{ env.IMG }}:tg-client-manager-${{ forgejo.run_number }} tg-client-manager

      - name: Log in to Registry and push
        run: |
          echo "${{ secrets.HAJIME_PASSWD }}" | docker login ${{ env.REPO_URL }} -u lexus --password-stdin
          docker push ${{ env.IMG }}:tg-client-manager-${{ forgejo.run_number }} 

      - name: Trigger Kubernetes Rollout
        run: | 
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/kubeconfig.yaml
          export KUBECONFIG=$GITHUB_WORKSPACE/kubeconfig.yaml

          # Trigger restart
          kubectl rollout restart deployment tg-client-manager -n debugging-testcrash-pub

      