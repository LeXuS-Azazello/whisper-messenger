name: "[main-voicemsg-mail] Deploy to Cloudflare"

on:
  push:
    branches:
      - main
    paths:
      - '.forgejo/workflows/voicemsg-mail.yaml'
      - 'voicemsg-mail/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: kube
    container:
      image: node:20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        working-directory: voicemsg-mail
        run: npm ci

      - name: Deploy to Cloudflare Workers
        working-directory: voicemsg-mail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
