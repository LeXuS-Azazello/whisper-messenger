name: "[main-tg-client] Build and push my telegram"
on:
  workflow_dispatch: 
  push:
    branches:
      - main
    paths:
      - '.forgejo/workflows/tg-client.yaml'
      - 'kubernetes/base/tg-client.yaml'
      - 'tg-client/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: kube
    container:
      image: forge.dev.takatan.cloud/takatan/docker-builder:latest
      credentials:
        username: lexus
        password: ${{ secrets.HAJIME_PASSWD }}
    env:
      DOCKER_HOST: tcp://172.18.0.1:2375
      REPO_URL: forge.dev.takatan.cloud
      IMG: forge.dev.takatan.cloud/lexus/voicemsg-net
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build -f tg-client/Dockerfile -t ${{ env.IMG }}:tg-client-latest -t ${{ env.IMG }}:tg-client-${{ forgejo.run_number }} --platform=linux/amd64 tg-client

      - name: Log in to Registry and push
        run: |
          echo "${{ secrets.HAJIME_PASSWD }}" | docker login ${{ env.REPO_URL }} -u lexus --password-stdin
          docker push ${{ env.IMG }}:tg-client-${{ forgejo.run_number }} 
          docker push ${{ env.IMG }}:tg-client-latest

      - name: Trigger Kubernetes Rollout
        run: |
          # Use the checked-in kubeconfig instead of interactive login
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > ~/.kube/config
          export KUBECONFIG=~/.kube/config

          # Trigger restart
          kubectl delete pod -l app=tg-client-user -n debugging-testcrash-pub
