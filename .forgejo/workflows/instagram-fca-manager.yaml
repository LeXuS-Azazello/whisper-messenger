name: "[main-instagram-fca-manager] Build and push"

on:
  push:
    branches:
      - main
    paths:
      - '.forgejo/workflows/instagram-fca-manager.yaml'
      - 'kubernetes/base/instagram-fca-manager.yaml'
      - 'instagram-fca-manager/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: kube
    container:
      image: forge.dev.takatan.cloud/takatan/docker-builder:latest
      credentials:
        username: lexus
        password: ${{ secrets.DOCKER_FORGE_PACKAGE_TOKEN }}
    env:
      DOCKER_HOST: tcp://172.18.0.1:2375
      REPO_URL: https://forge.dev.takatan.cloud
      IMG: forge.dev.takatan.cloud/lexus/voicemsg-net
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build -f instagram-fca-manager/Dockerfile -t ${{ env.IMG }}:instagram-fca-manager-latest -t ${{ env.IMG }}:instagram-fca-manager-${{ forgejo.run_number }} instagram-fca-manager

      - name: Log in to Registry and push
        run: |
          echo "${{ secrets.DOCKER_FORGE_PACKAGE_TOKEN }}" | docker login ${{ env.REPO_URL }} -u lexus --password-stdin
          docker push ${{ env.IMG }}:instagram-fca-manager-${{ forgejo.run_number }} && docker push ${{ env.IMG }}:instagram-fca-manager-latest

      - name: Trigger Kubernetes Rollout
        env:
          DOCKER_FORGE_PACKAGE_TOKEN: ${{ secrets.DOCKER_FORGE_PACKAGE_TOKEN }}
        run: |
          
          
          # Use the checked-in kubeconfig instead of interactive login
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/kubeconfig.yaml
          export KUBECONFIG=$GITHUB_WORKSPACE/kubeconfig.yaml

          # Trigger restart
          kubectl rollout restart deployment instagram-fca-manager -n debugging-testcrash-pub
