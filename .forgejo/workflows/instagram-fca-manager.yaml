name: "[main-instagram-fca-manager] Build and push"

on:
  push:
    branches:
      - main
    paths:
      - '.forgejo/workflows/instagram-fca-manager.yaml'
      - 'kubernetes/base/instagram-fca-manager.yaml'
      - 'instagram-fca-manager/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: kube
    container:
      image: forge.dev.takatan.cloud/takatan/docker-builder:latest
      credentials:
        username: lexus
        password: ${{ secrets.DOCKER_FORGE_PACKAGE_TOKEN }}
    env:
      DOCKER_HOST: tcp://172.18.0.1:2375
      REPO_URL: https://forge.dev.takatan.cloud
      IMG: forge.dev.takatan.cloud/lexus/voicemsg-net
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build -f instagram-fca-manager/Dockerfile -t ${{ env.IMG }}:instagram-fca-manager-latest -t ${{ env.IMG }}:instagram-fca-manager-${{ github.sha }} instagram-fca-manager

      - name: Log in to Registry and push
        run: |
          echo "${{ secrets.DOCKER_FORGE_PACKAGE_TOKEN }}" | docker login ${{ env.REPO_URL }} -u lexus --password-stdin
          docker push ${{ env.IMG }}:instagram-fca-manager-${{ github.sha }} && docker push ${{ env.IMG }}:instagram-fca-manager-latest

      - name: Trigger Kubernetes Rollout
        env:
          DOCKER_FORGE_PACKAGE_TOKEN: ${{ secrets.DOCKER_FORGE_PACKAGE_TOKEN }}
        run: |
          # Install kube-dc CLI
          if command -v sudo >/dev/null 2>&1; then
            sudo mkdir -p /usr/local/bin
            sudo curl -sL https://github.com/kube-dc/kube-dc-public/releases/latest/download/kube-dc_linux_amd64 -o /usr/local/bin/kube-dc
            sudo chmod +x /usr/local/bin/kube-dc
          else
            mkdir -p /usr/local/bin
            curl -sL https://github.com/kube-dc/kube-dc-public/releases/latest/download/kube-dc_linux_amd64 -o /usr/local/bin/kube-dc
            chmod +x /usr/local/bin/kube-dc
          fi
          export PATH=$PATH:/usr/local/bin

          # Login and configure kubectl
          kube-dc login --domain kube-dc.cloud --org debugging

          # Switch to project context
          kube-dc use kube-dc.cloud/debugging/testcrash-pub

          # Trigger restart
          kubectl rollout restart deployment instagram-fca-manager -n debugging-testcrash-pub
