name: "[main-frontend] Build and push"

on:
  push:
    branches:
      - main
    paths:
      - 'kubernetes/base/frontend.yml'
      - 'src/*'
jobs:
  build:
    runs-on: kube
    container:
      image: forge.dev.takatan.cloud/takatan/docker-builder:latest
      credentials:
        username: lexus
        password: ${{ secrets.DOCKER_FORGE_PACKAGE_TOKEN }}
    env:
      DOCKER_HOST: tcp://172.18.0.1:2375
      REPO_URL: https://forge.dev.takatan.cloud
      IMG: forge.dev.takatan.cloud/lexus/voicemsg-net
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build -f Dockerfile -t ${{ env.IMG }}:frontend-latest -t ${{ env.IMG }}:frontend-${{ github.sha }} .

      - name: Log in to Registry and push
        run: |
          echo "${{ secrets.DOCKER_FORGE_PACKAGE_TOKEN }}" | docker login ${{ env.REPO_URL }} -u lexus --password-stdin
          docker push ${{ env.IMG }}:frontend-${{ github.sha }} && docker push ${{ env.IMG }}:frontend-latest
