name: "[main-whatsapp-baileys-client] Build and push"

on:
  push:
    branches:
      - main
    paths:
      - '.forgejo/workflows/whatsapp-baileys-client.yaml'
      - 'whatsapp-baileys-client/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: kube
    container:
      image: forge.dev.takatan.cloud/takatan/docker-builder:latest
      credentials:
        username: lexus
        password: ${{ secrets.DOCKER_FORGE_PACKAGE_TOKEN }}
    env:
      DOCKER_HOST: tcp://172.18.0.1:2375
      REPO_URL: https://forge.dev.takatan.cloud
      IMG: forge.dev.takatan.cloud/lexus/voicemsg-net
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build -f whatsapp-baileys-client/Dockerfile -t ${{ env.IMG }}:whatsapp-baileys-client-latest -t ${{ env.IMG }}:whatsapp-baileys-client-${{ github.sha }} whatsapp-baileys-client

      - name: Log in to Registry and push
        run: |
          echo "${{ secrets.DOCKER_FORGE_PACKAGE_TOKEN }}" | docker login ${{ env.REPO_URL }} -u lexus --password-stdin
          docker push ${{ env.IMG }}:whatsapp-baileys-client-${{ github.sha }} && docker push ${{ env.IMG }}:whatsapp-baileys-client-latest

      - name: Trigger Kubernetes Rollout
        env:
          DOCKER_FORGE_PACKAGE_TOKEN: ${{ secrets.DOCKER_FORGE_PACKAGE_TOKEN }}
        run: |
          # Ensure kubectl is installed
          if ! command -v kubectl >/dev/null 2>&1; then
            curl -sLO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            if command -v sudo >/dev/null 2>&1; then
              sudo mv kubectl /usr/local/bin/
            else
              mkdir -p /usr/local/bin
              mv kubectl /usr/local/bin/
              export PATH=$PATH:/usr/local/bin
            fi
          fi
          
          # Use the checked-in kubeconfig instead of interactive login
          export KUBECONFIG=$GITHUB_WORKSPACE/voicemsg-clr-kubeconfig.yaml

          # Trigger restart
          kubectl delete pod -l app=wa-baileys-client -n debugging-testcrash-pub
