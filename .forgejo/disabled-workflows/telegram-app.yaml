name: "[main-telegram-app] Build and push"

on:
  push:
    branches:
      - main
    paths:
      - '.forgejo/workflows/telegram-app.yaml'
      - 'kubernetes/base/telegram-app.yaml'
      - 'src/**'
      - 'Dockerfile'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: kube
    container:
      image: forge.dev.takatan.cloud/takatan/docker-builder:latest
      credentials:
        username: lexus
        password: ${{ secrets.HAJIME_PASSWD }}
    env:
      DOCKER_HOST: tcp://172.18.0.1:2375
      REPO_URL: forge.dev.takatan.cloud
      IMG: forge.dev.takatan.cloud/lexus/voicemsg-net
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build -f Dockerfile -t ${{ env.IMG }}:telegram-app-latest -t ${{ env.IMG }}:telegram-app-${{ forgejo.run_number }} .

      - name: Log in to Registry and push
        run: |
          echo "${{ secrets.HAJIME_PASSWD }}" | docker login ${{ env.REPO_URL }} -u lexus --password-stdin
          docker push ${{ env.IMG }}:telegram-app-${{ forgejo.run_number }} && docker push ${{ env.IMG }}:telegram-app-latest

      - name: Trigger Kubernetes Rollout
        run: |
          # Use the checked-in kubeconfig instead of interactive login
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/kubeconfig.yaml
          export KUBECONFIG=$GITHUB_WORKSPACE/kubeconfig.yaml

          # Trigger restart
          kubectl rollout restart deployment telegram-app -n debugging-testcrash-pub
