apiVersion: batch/v1
kind: Job
metadata:
  name: install-ollama
  namespace: debugging-llm-proj
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: install-ollama
    spec:
      restartPolicy: OnFailure
      containers:
      - name: installer
        image: shalb/kube-dc-kubectl:v0.6.5
        env:
        - name: VMI_IP
          value: "10.0.0.19"
        - name: SSH_KEY
          value: /usr/local/ssh-private-key/id_rsa
        command:
        - /bin/bash
        - -c
        - |
          # Wait for SSH to be ready
          for i in {1..30}; do
            ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 -i $SSH_KEY ubuntu@$VMI_IP 'echo ready' && break
            sleep 2
          done
          
          # Install ollama
          ssh -o StrictHostKeyChecking=accept-new -i $SSH_KEY ubuntu@$VMI_IP << 'EOF'
            set -e
            curl -fsSL https://ollama.com/install.sh | sh
            sudo systemctl enable ollama
            sudo systemctl start ollama
            ollama pull gemma4
            echo "Ollama installed successfully"
          EOF
        volumeMounts:
        - name: ssh-key
          mountPath: /usr/local/ssh-private-key/
          readOnly: true
      volumes:
      - name: ssh-key
        secret:
          secretName: ssh-keypair-default
          defaultMode: 256