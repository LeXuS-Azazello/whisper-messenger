name: Deploy to Kube-DC

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > /tmp/kubeconfig.yaml
          export KUBECONFIG=/tmp/kubeconfig.yaml

      - name: Login to Docker registry
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Deploy base resources
        run: |
          kubectl apply -k kubernetes/base/ -n debugging-testcrash-cloud
          kubectl apply -f kubernetes/redis.yaml -n debugging-testcrash-cloud

      - name: Deploy frontend
        run: |
          kubectl apply -f kubernetes/frontend.yaml -n debugging-testcrash-cloud
          
      - name: Deploy bridge manager
        run: |
          kubectl apply -f kubernetes/mtproto-bridge-manager.yaml -n debugging-testcrash-cloud

      - name: Deploy messaging services
        run: |
          kubectl apply -f kubernetes/qwen3-asr.yaml -n debugging-testcrash-cloud
          kubectl apply -f kubernetes/ingress-nginx.yaml -n debugging-testcrash-cloud
          kubectl apply -f kubernetes/ingress.yaml -n debugging-testcrash-cloud
          kubectl apply -f kubernetes/grafana.yaml -n debugging-testcrash-cloud
          kubectl apply -f kubernetes/prometheus.yaml -n debugging-testcrash-cloud
          kubectl apply -f kubernetes/fluentd.yaml -n debugging-testcrash-cloud
          kubectl apply -f kubernetes/rbac.yaml -n debugging-testcrash-cloud

      - name: Deploy secrets
        run: |
          kubectl apply -f kubernetes/whisper-messenger-env-secret.yaml -n debugging-testcrash-cloud

      - name: Restart frontend for latest code
        run: |
          kubectl rollout restart deployment echo-frontend -n debugging-testcrash-cloud
          
      - name: Verify deployment
        run: |
          kubectl get pods -n debugging-testcrash-cloud
          kubectl get svc -n debugging-testcrash-cloud
