apiVersion: v1
kind: Config
current-context: kube-dc/kube-dc.cloud/debugging/echovoice
clusters:
    - name: voice-cluste-cp
      cluster:
        server: https://91.224.11.35:6443
        certificate-authority-data: 
    - name: kube-dc-kube-dc.cloud-debugging
      cluster:
        server: https://kube-api.kube-dc.cloud:6443
        insecure-skip-tls-verify: true
contexts:
    - name: kubernetes-admin@voice-cluste-cp
      context:
        cluster: voice-cluste-cp
        user: kubernetes-admin
    - name: kube-dc/kube-dc.cloud/debugging/echovoice
      context:
        cluster: kube-dc-kube-dc.cloud-debugging
        user: kube-dc@kube-dc.cloud/debugging
        namespace: debugging-echovoice
    - name: kube-dc/kube-dc.cloud/debugging/ollama-coding
      context:
        cluster: kube-dc-kube-dc.cloud-debugging
        user: kube-dc@kube-dc.cloud/debugging
        namespace: debugging-ollama-coding
users:
    - name: kubernetes-admin
      user: {}
    - name: kube-dc@kube-dc.cloud/debugging
      user:
        exec:
            apiVersion: client.authentication.k8s.io/v1
            command: kube-dc
            args:
                - credential
                - --server
                - https://kube-api.kube-dc.cloud:6443
            interactiveMode: IfAvailable
