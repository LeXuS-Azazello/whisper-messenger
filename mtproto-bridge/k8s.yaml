apiVersion: v1
kind: ServiceAccount
metadata:
  name: mtproto-bridge-sa
  namespace: debugging-echovoice
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-manager-role
  namespace: debugging-echovoice
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mtproto-bridge-rb
  namespace: debugging-echovoice
subjects:
- kind: ServiceAccount
  name: mtproto-bridge-sa
  namespace: debugging-echovoice
roleRef:
  kind: Role
  name: pod-manager-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtproto-bridge-manager
  namespace: debugging-echovoice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mtproto-bridge-manager
  template:
    metadata:
      labels:
        app: mtproto-bridge-manager
    spec:
      serviceAccountName: mtproto-bridge-sa
      containers:
      - name: bridge
        image: azazellosaraksh/debugging-mtproto-bridge:latest
        ports:
        - containerPort: 3000
        env:
        - name: MODE
          value: "MANAGER"
        - name: BRIDGE_SECRET
          value: "changeme"
        - name: TG_API_ID
          value: "13867088"
        - name: TG_API_HASH
          value: "a9ba48d3de86ff6db73b41165ac5ec9a"
        - name: WORKER_URL
          value: "https://whisper.debug.org.ua"
        - name: CF_ACCOUNT_ID
          value: "b62058e5d03373722a76f2722b5120a1"
        - name: CF_KV_NAMESPACE_ID
          value: "f4b04260ccfa4f1ea34c4fab2d53ed1d"
        - name: CF_API_TOKEN
          value: "5-iiz7W_m1F166Lw6GzF6e18LHe_3EAn0C84U5Yj"
        - name: WHISPER_SERVER_URL
          value: "http://sherpa-onnx:8000"
        - name: WHISPER_SECRET
          value: "whisper-sh-secret-2026"
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: BRIDGE_IMAGE
          value: "azazellosaraksh/debugging-mtproto-bridge:latest"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --no-autoupdate
        - run
        - --token
        - eyJhIjoiZmZhMjc2NTFhNjQ3ZDM3YTcxZmIzYWVhZTk2OWM3NjIiLCJ0IjoiMmY1N2Y3MGUtNTAwYi00ODIyLTliMWQtYTY1Yzk0YmUxMjE1IiwicyI6Imhpa1BmRjRtYmkrWDlEQkRnNFE2SHFwbnA1d283TFd4ME8vSnYyVi9Ga3c9In0=
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mtproto-bridge-manager
  namespace: debugging-echovoice
spec:
  selector:
    app: mtproto-bridge-manager
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
