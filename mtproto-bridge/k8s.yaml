apiVersion: v1
kind: ServiceAccount
metadata:
  name: mtproto-bridge-sa
  namespace: debugging-echovoice
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-manager-role
  namespace: debugging-echovoice
rules:
- apiGroups:
  - ''
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
  - create
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mtproto-bridge-rb
  namespace: debugging-echovoice
subjects:
- kind: ServiceAccount
  name: mtproto-bridge-sa
  namespace: debugging-echovoice
roleRef:
  kind: Role
  name: pod-manager-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtproto-bridge-manager
  namespace: debugging-echovoice
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: mtproto-bridge-manager
  template:
    metadata:
      labels:
        app: mtproto-bridge-manager
    spec:
      # hostNetwork removed to allow pod-to-pod networking (Redis, Whisper, etc.)
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/os: linux
      serviceAccountName: mtproto-bridge-sa
      containers:
      - name: bridge
        image: azazellosaraksh/debugging-mtproto-bridge:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          # Add readiness probe for proper startup detection
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
        env:
        - name: MODE
          value: MANAGER
        - name: TG_API_ID
          value: "13867088"
        - name: TG_API_HASH
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: TELEGRAM_APP_HASH
              optional: false
        - name: BRIDGE_SECRET
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: BRIDGE_SECRET
              optional: false
        - name: WORKER_URL
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: WORKER_URL
              optional: false
        - name: WHISPER_SERVER_URL
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: LOCAL_WHISPER_URL
              optional: false
        - name: WHISPER_SECRET
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: LOCAL_WHISPER_SECRET
              optional: false
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: BRIDGE_IMAGE
          value: azazellosaraksh/debugging-mtproto-bridge:latest
        - name: REDIS_URL
          value: redis://redis:6379
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mtproto-bridge-manager
  namespace: debugging-echovoice
spec:
  # clusterIP: None
  selector:
    app: mtproto-bridge-manager
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
