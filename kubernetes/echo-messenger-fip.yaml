# Floating IP for voicemsg.net services
# This provides direct 1:1 NAT between external IP and internal services
# All ports are mapped — services are fully accessible as if they had public IPs

# EIP for the Floating IP (auto-allocated when using externalNetworkType: public)
# The FIP will automatically create and bind a dedicated EIP
apiVersion: kube-dc.com/v1
kind: FIp
metadata:
  name: voicemsg-frontend-fip
  namespace: debugging-testcrash-cloud
spec:
  externalNetworkType: public
  vmTarget:
    vmName: voicemsg-frontend
    interfaceName: vpc_net_0
---
# Additional FIP for bridge manager (needed for Telegram webhook callbacks)
apiVersion: kube-dc.com/v1
kind: FIp
metadata:
  name: voicemsg-bridge-fip
  namespace: debugging-testcrash-cloud
spec:
  externalNetworkType: public
  vmTarget:
    vmName: voicemsg-bridge
    interfaceName: vpc_net_0
