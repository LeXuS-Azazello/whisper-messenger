---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: translation-service
  namespace: debugging-testcrash-pub
  labels:
    app: translation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: translation-service
  template:
    metadata:
      labels:
        app: translation-service
    spec:
      containers:
        - name: translation-service
          image: your-registry/translation-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: HF_HOME
              value: "/hf-cache"
            - name: HF_LOCAL_FILES_ONLY
              value: "true"
            - name: NUM_THREADS
              value: "4"
            - name: INTER_THREADS
              value: "2"
          resources:
            requests:
              cpu: "1"
              memory: "512Mi"
            limits:
              cpu: "4"
              memory: "1500Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: translation-service
  namespace: debugging-testcrash-pub
  labels:
    app: translation-service
spec:
  selector:
    app: translation-service
  ports:
    - name: http
      port: 8001
      targetPort: 8001
  type: ClusterIP

---
# Пример использования:
# POST http://translation-service.debugging-testcrash-pub.svc.cluster.local:8001/v1/translate
# {
#   "text": "Привет",
#   "source_language": "rus_Cyrl",
#   "target_language": "eng_Latn"
# }
