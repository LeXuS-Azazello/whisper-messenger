apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voicemsg-ingress
  namespace: debugging-testcrash-cloud
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - testcrash-cloud.voicemsg.net
      secretName: testcrash-cloud-tls
  rules:
    - host: testcrash-cloud.voicemsg.net
      http:
        paths:
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: echo-frontend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echo-frontend
                port:
                  number: 80