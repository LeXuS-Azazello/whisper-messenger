apiVersion: v1
kind: ServiceAccount
metadata:
  name: mtproto-bridge-sa
  namespace: debugging-voicemsg
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-manager-role
  namespace: debugging-voicemsg
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mtproto-bridge-rb
  namespace: debugging-voicemsg
subjects:
- kind: ServiceAccount
  name: mtproto-bridge-sa
  namespace: debugging-voicemsg
roleRef:
  kind: Role
  name: pod-manager-role
  apiGroup: rbac.authorization.k8s.io
---
# Redis for session management and caching
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: debugging-voicemsg
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: debugging-voicemsg
data:
  redis.conf: |
    maxmemory 512mb
    maxmemory-policy allkeys-lru
    save 900 1
    save 300 10
    save 60 10000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: debugging-voicemsg
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command:
        - redis-server
        - /usr/local/etc/redis/redis.conf
        volumeMounts:
        - name: redis-config
          mountPath: /usr/local/etc/redis/redis.conf
          subPath: redis.conf
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: redis-config
        configMap:
          name: redis-config
          items:
          - key: redis.conf
            path: redis.conf
      - name: redis-data
        emptyDir: {}
---
# Qwen3-ASR Service for transcription
apiVersion: v1
kind: Service
metadata:
  name: qwen3-asr
  namespace: debugging-voicemsg
spec:
  selector:
    app: qwen3-asr
  ports:
  - port: 11434
    targetPort: 11434
    name: http
  - port: 11435
    targetPort: 11435
    name: grpc
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen3-asr-pvc
  namespace: debugging-voicemsg
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: default
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-asr
  namespace: debugging-voicemsg
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: qwen3-asr
  template:
    metadata:
      labels:
        app: qwen3-asr
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: qwen3-asr
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        - containerPort: 11435
        env:
        - name: OLLAMA_KEEP_ALIVE
          value: "3600"
        - name: OLLAMA_MAX_LOADED_MODELS
          value: "1"
        - name: OLLAMA_NUM_PARALLEL
          value: "1"
        - name: OLLAMA_MODELS
          value: "/root/.ollama/models"
        volumeMounts:
        - name: qwen3-asr-storage
          mountPath: /root/.ollama
        - name: qwen3-asr-pvc
          mountPath: /models
        resources:
          requests:
            cpu: "4"
            memory: "16Gi"
          limits:
            cpu: "8"
            memory: "32Gi"
        livenessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 30
          periodSeconds: 15
        startupProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 30
      volumes:
      - name: qwen3-asr-storage
        emptyDir: {}
      - name: qwen3-asr-pvc
        persistentVolumeClaim:
          claimName: qwen3-asr-pvc
---
# MTProto Bridge Manager
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtproto-bridge-manager
  namespace: debugging-voicemsg
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: mtproto-bridge-manager
  template:
    metadata:
      labels:
        app: mtproto-bridge-manager
    spec:
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/os: linux
      serviceAccountName: mtproto-bridge-sa
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: bridge
        image: azazellosaraksh/debugging-mtproto-bridge:v2
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: MODE
          value: "MANAGER"
        - name: TG_API_ID
          value: "13867088"
        - name: TG_API_HASH
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: TELEGRAM_APP_HASH
              optional: false
        - name: BRIDGE_SECRET
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: BRIDGE_SECRET
              optional: false
        - name: WORKER_URL
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: WORKER_URL
              optional: false
        - name: QWEN_ASR_URL
          value: "http://qwen3-asr:11434"
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: BRIDGE_IMAGE
          value: azazellosaraksh/debugging-mtproto-bridge:v2
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: DEVICE_MODEL
          value: "MTProto Bridge Manager"
        - name: APP_VERSION
          value: "2.0.0"
        - name: SYSTEM_VERSION
          value: "Kubernetes"
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mtproto-bridge-manager
  namespace: debugging-voicemsg
spec:
  selector:
    app: mtproto-bridge-manager
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
---
# User Pod Template (spawned dynamically)
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-pod-template
  namespace: debugging-voicemsg
data:
  pod-template.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      labels:
        app: tg-user-bridge
    spec:
      containers:
      - name: bridge
        image: azazellosaraksh/debugging-mtproto-bridge:v2
        env:
        - name: MODE
          value: "USER"
        - name: DEVICE_MODEL
          value: "MTProto User Bridge"
        - name: APP_VERSION
          value: "2.0.0"
        - name: SYSTEM_VERSION
          value: "Kubernetes"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mtproto-bridge-ingress
  namespace: debugging-voicemsg
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
  - host: bridge.voicemsg.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mtproto-bridge-manager
            port:
              number: 3000
---
# Network Policy for isolation
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mtproto-bridge-network-policy
  namespace: debugging-voicemsg
spec:
  podSelector:
    matchLabels:
      app: tg-user-bridge
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: mtproto-bridge-manager
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: qwen3-asr
    ports:
    - protocol: TCP
      port: 11434
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80