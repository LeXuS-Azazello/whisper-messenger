apiVersion: v1
kind: ServiceAccount
metadata:
  name: mtproto-bridge-sa
  namespace: debugging-testcrash-cloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-manager-role
  namespace: debugging-testcrash-cloud
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mtproto-bridge-rb
  namespace: debugging-testcrash-cloud
subjects:
- kind: ServiceAccount
  name: mtproto-bridge-sa
  namespace: debugging-testcrash-cloud
roleRef:
  kind: Role
  name: pod-manager-role
  apiGroup: rbac.authorization.k8s.io
---
# User Pod Template (spawned dynamically)
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-pod-template
  namespace: debugging-testcrash-cloud
data:
  pod-template.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      labels:
        app: tg-user-bridge
    spec:
      containers:
      - name: bridge
        image: azazellosaraksh/debugging-mtproto-bridge:v2
        env:
        - name: MODE
          value: "USER"
        - name: DEVICE_MODEL
          value: "MTProto User Bridge"
        - name: APP_VERSION
          value: "2.0.0"
        - name: SYSTEM_VERSION
          value: "Kubernetes"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mtproto-bridge-ingress
  namespace: debugging-testcrash-cloud
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
  - host: voicemsg.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mtproto-bridge-manager
            port:
              number: 3000
---
# Network Policy for isolation
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mtproto-bridge-network-policy
  namespace: debugging-testcrash-cloud
spec:
  podSelector:
    matchLabels:
      app: tg-user-bridge
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: mtproto-bridge-manager
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: qwen3-asr
    ports:
    - protocol: TCP
      port: 11434
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80