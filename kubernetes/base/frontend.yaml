apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-frontend
  template:
    metadata:
      labels:
        app: echo-frontend
    spec:
      serviceAccountName: voicemsg-client-manager
      imagePullSecrets:
        - name: forgejo-pull-secret
      containers:
      - name: frontend
        image: lexus/voicemsg-net:frontend-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: MODE
          value: "FRONTEND"
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: MONGODB_URI
          value: "mongodb://mongodb:27017/voicemsg"
        - name: MANAGER_SECRET
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: MANAGER_SECRET
              optional: true
        - name: MANAGER_URL
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: MANAGER_URL
              optional: true
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: SESSION_SECRET
              optional: true
        - name: WORKER_URL
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: WORKER_URL
              optional: true
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: GOOGLE_CLIENT_ID
              optional: true
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: GOOGLE_CLIENT_SECRET
              optional: true
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: TELEGRAM_BOT_TOKEN
              optional: true
        - name: TELEGRAM_BOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: TELEGRAM_BOT_USERNAME
              optional: true
        - name: ADMIN_SECRET
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: ADMIN_SECRET
              optional: true
        - name: TELEGRAM_MINI_APP_URL
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: TELEGRAM_MINI_APP_URL
              optional: true
        - name: TELEGRAM_APP_ID
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: TELEGRAM_APP_ID
              optional: true
        - name: TELEGRAM_APP_HASH
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: TELEGRAM_APP_HASH
              optional: true
        - name: MAIL_WORKER_URL
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: MAIL_WORKER_URL
              optional: true
        - name: MAIL_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: MAIL_API_TOKEN
              optional: true
        - name: WA_MANAGER_URL
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: WA_MANAGER_URL
              optional: true
        - name: FB_MANAGER_URL
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: FB_MANAGER_URL
              optional: true
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: echo-frontend
spec:
  type: ClusterIP
  selector:
    app: echo-frontend
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http