apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-frontend
  template:
    metadata:
      labels:
        app: echo-frontend
    spec:
      imagePullSecrets:
      - name: harbor-pull-secret
      containers:
      - name: frontend
        image: harbor.dev.takatan.cloud/devcenter/whisper-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: MODE
          value: "FRONTEND"
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: MONGODB_URI
          value: "mongodb://mongodb:27017/voicemsg"
        - name: MANAGER_SECRET
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: MANAGER_SECRET
              optional: true
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: SESSION_SECRET
              optional: true
        - name: WORKER_URL
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: WORKER_URL
              optional: true
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: GOOGLE_CLIENT_ID
              optional: true
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: GOOGLE_CLIENT_SECRET
              optional: true
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: TELEGRAM_BOT_TOKEN
              optional: true
        - name: TELEGRAM_BOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: TELEGRAM_BOT_USERNAME
              optional: true
        - name: ADMIN_SECRET
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: ADMIN_SECRET
              optional: true
        - name: TELEGRAM_MINI_APP_URL
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: TELEGRAM_MINI_APP_URL
              optional: true
        - name: TELEGRAM_APP_ID
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: TELEGRAM_APP_ID
              optional: true
        - name: TELEGRAM_APP_HASH
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: TELEGRAM_APP_HASH
              optional: true
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: echo-frontend
spec:
  type: ClusterIP
  selector:
    app: echo-frontend
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http