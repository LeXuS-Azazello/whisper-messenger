apiVersion: v1
kind: ConfigMap
metadata:
  name: wa-baileys-pod-template
data:
  pod-template.json: |
    {
      "apiVersion": "v1",
      "kind": "Pod",
      "metadata": {
        "name": "wa-baileys-user",
        "labels": {
          "app": "wa-baileys-client"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "wa-baileys-client",
            "image": "harbor.dev.takatan.cloud/devcenter/whatsapp-baileys-client:latest",
            "imagePullPolicy": "Always",
            "env": [
              {
                "name": "REDIS_URL",
                "value": "redis://redis:6379"
              },
              {
                "name": "WHISPER_URL",
                "value": "http://whisper-service-v2.debugging-testcrash-pub.svc.cluster.local:8000"
              },
              {
                "name": "WHISPER_SECRET",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "voicemsg-secrets",
                    "key": "WHISPER_SECRET"
                  }
                }
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "512Mi"
              }
            }
          }
        ],
        "imagePullSecrets": [
          {
            "name": "harbor-pull-secret"
          }
        ],
        "restartPolicy": "Never"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-baileys-manager
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: whatsapp-baileys-manager
  template:
    metadata:
      labels:
        app: whatsapp-baileys-manager
    spec:
      serviceAccountName: voicemsg-client-manager
      imagePullSecrets:
      - name: harbor-pull-secret
      containers:
      - name: manager
        image: harbor.dev.takatan.cloud/devcenter/whatsapp-baileys-manager:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3002
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        env:
        - name: MODE
          value: "MANAGER"
        - name: PORT
          value: "3002"
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: MANAGER_SECRET
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: MONGODB_URI
          value: "mongodb://mongodb:27017/voicemsg"
---
apiVersion: v1
kind: Service
metadata:
  name: whatsapp-baileys-manager
spec:
  selector:
    app: whatsapp-baileys-manager
  ports:
  - port: 3002
    targetPort: 3002
