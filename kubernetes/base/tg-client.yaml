# ConfigMap: User Pod Template for tg-client
# Used by tg-client-manager to spawn per-user Telegram client pods
apiVersion: v1
kind: ConfigMap
metadata:
  name: tg-client-pod-template
data:
  pod-template.json: |
    {
      "apiVersion": "v1",
      "kind": "Pod",
      "metadata": {
        "labels": {
          "app": "tg-client-user"
        }
      },
      "spec": {
        "imagePullSecrets": [
          { "name": "dockerhub-pull-secret" }
        ],
        "containers": [{
          "name": "tg-client",
          "image": "lexusazazello/voicemsg:tg-client-latest",
          "imagePullPolicy": "Always",
          "env": [
            { "name": "MODE", "value": "USER" },
            { "name": "TG_API_ID", "valueFrom": {"secretKeyRef": {"name": "voicemsg-secrets", "key": "TELEGRAM_APP_ID"}} },
            { "name": "TG_API_HASH", "valueFrom": {"secretKeyRef": {"name": "voicemsg-secrets", "key": "TELEGRAM_APP_HASH"}} },
            { "name": "MANAGER_URL", "value": "http://tg-client-manager:3000" },
            { "name": "MANAGER_SECRET", "valueFrom": {"secretKeyRef": {"name": "voicemsg-secrets", "key": "MANAGER_SECRET"}} },
            { "name": "REDIS_URL", "value": "redis://redis:6379" },
            { "name": "MONGODB_URI", "value": "mongodb://mongodb:27017/voicemsg" },
            { "name": "DEVICE_MODEL", "value": "Desktop Linux" },
            { "name": "APP_VERSION", "value": "4.15.2" },
            { "name": "SYSTEM_VERSION", "value": "Ubuntu 24.04" },
            { "name": "FUNASR_URL", "value": "http://funasr:50001" },
            { "name": "ASR_SECRET", "valueFrom": {"secretKeyRef": {"name": "voicemsg-secrets", "key": "ASR_SECRET", "optional": true}} },
            { "name": "SAMESAME_SECRET", "valueFrom": {"secretKeyRef": {"name": "voicemsg-secrets", "key": "SAMESAME_SECRET"}} },
            { "name": "SAMESAME_URL", "value": "http://samesame:8002" }
          ],
          "volumeMounts": [{
            "name": "tdlib-storage",
            "mountPath": "/app/tdlib-data"
          }],
          "resources": {
            "requests": { "cpu": "50m", "memory": "128Mi" },
            "limits": { "cpu": "200m", "memory": "256Mi" }
          }
        }],
        "volumes": [{
          "name": "tdlib-storage",
          "emptyDir": {}
        }],
        "restartPolicy": "Always"
      }
    }
---
# Service for accessing tg-client pods
apiVersion: v1
kind: Service
metadata:
  name: tg-client
  labels:
    app: tg-client
spec:
  clusterIP: None
  selector:
    app: tg-client-user
  ports:
  - name: http
    port: 3001
    targetPort: 3001
    protocol: TCP