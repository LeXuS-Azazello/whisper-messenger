apiVersion: v1
kind: ConfigMap
metadata:
  name: whisper-turbo-script
data:
  serve_whisper.py: |
    import os
    import tempfile
    import torch
    import uvicorn
    from fastapi import FastAPI, UploadFile, File, Form
    from transformers import AutoModelForSpeechSeq2Seq, AutoProcessor, pipeline

    app = FastAPI()

    device = "cpu"
    torch_dtype = torch.float32
    torch.set_num_threads(8)
    model_id = "openai/whisper-large-v3-turbo"

    print(f"Loading Whisper Turbo model on {device}...")
    try:
        model = AutoModelForSpeechSeq2Seq.from_pretrained(
            model_id, 
            torch_dtype=torch_dtype, 
            low_cpu_mem_usage=True, 
            use_safetensors=True
        ).to(device)
        
        processor = AutoProcessor.from_pretrained(model_id)

        pipe = pipeline(
            "automatic-speech-recognition",
            model=model,
            tokenizer=processor.tokenizer,
            feature_extractor=processor.feature_extractor,
            chunk_length_s=30,
            batch_size=1,
            torch_dtype=torch_dtype,
            device=device,
        )
        print("Model loaded successfully!")
    except Exception as e:
        print(f"FATAL: Failed to load model: {e}")
        import sys
        sys.exit(1)

    @app.get("/health")
    async def health():
        return {"status": "ok", "model": model_id, "device": device}

    @app.post("/v1/audio/transcriptions")
    async def transcribe(
        file: UploadFile = File(...), 
        model_name: str = Form(default="openai/whisper-large-v3-turbo"), 
        language: str = Form(default="auto"),
        task: str = Form(default="transcribe")
    ):
        print(f"Received transcription request: {file.filename}")
        content = await file.read()
        
        import asyncio
        loop = asyncio.get_event_loop()
        
        def process_audio():
            with tempfile.NamedTemporaryFile(delete=False, suffix=".ogg") as tmp:
                tmp.write(content)
                tmp_path = tmp.name

            try:
                generate_kwargs = {
                    "task": task,
                    "max_new_tokens": 448,
                }
                if language and language != "auto":
                    generate_kwargs["language"] = language
                    
                result = pipe(tmp_path, generate_kwargs=generate_kwargs)
                text = result.get("text", "")
                print(f"Transcription success: {text[:50]}...")
            except Exception as e:
                print(f"Error transcribing: {e}")
                text = ""
            finally:
                if os.path.exists(tmp_path):
                    os.remove(tmp_path)
            return text

        text = await loop.run_in_executor(None, process_audio)
        return {"text": text}
    
    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8000)

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whisper-turbo-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-turbo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper-turbo
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: whisper-turbo
      annotations:
        rollout-trigger: "202605190612"
    spec:
      imagePullSecrets:
      - name: harbor-pull-secret
      containers:
      - name: whisper-turbo
        image: harbor.dev.takatan.cloud/devcenter/python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "Starting whisper-turbo pod..."
          # Install system dependencies for audio processing
          apt-get update && apt-get install -y libsndfile1 ffmpeg --no-install-recommends
          
          # Install dependencies
          pip install --upgrade pip
          # Check if we have GPU support in the environment
          if command -v nvidia-smi &> /dev/null; then
            echo "GPU detected, installing CUDA torch..."
            pip install torch torchaudio transformers accelerate flash-attn --no-build-isolation
          else
            echo "No GPU detected, installing CPU torch..."
            pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
            pip install transformers accelerate
          fi
          pip install python-multipart uvicorn fastapi
          
          # Run the server
          python3 /app/serve_whisper.py

        startupProbe:
          httpGet:
            path: /health
            port: 8000
          failureThreshold: 120
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 10

        ports:
        - containerPort: 8000
          name: http
        env:
        - name: VLLM_TARGET_DEVICE
          value: "cpu"
        - name: CUDA_VISIBLE_DEVICES
          value: ""
        - name: HF_HOME
          value: "/root/.cache/huggingface"
        - name: TRANSFORMERS_VERBOSITY
          value: "warning"
        resources:
          requests:
            cpu: "8000m"
            memory: "8Gi"
          limits:
            cpu: "16000m"
            memory: "16Gi"
        volumeMounts:
        - name: cache
          mountPath: /root/.cache
        - name: script-vol
          mountPath: /app
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: whisper-turbo-cache
      - name: script-vol
        configMap:
          name: whisper-turbo-script
---
apiVersion: v1
kind: Service
metadata:
  name: whisper-turbo
spec:
  selector:
    app: whisper-turbo
  ports:
  - name: http
    port: 8000
    targetPort: 8000
