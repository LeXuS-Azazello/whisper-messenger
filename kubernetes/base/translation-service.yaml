---
# Translation Service (NLLB-200-distilled-600M via CTranslate2)
#
# Provides fast offline translation for voice message transcriptions
# when the user has set a "Preferred Translation Language" in the dashboard.
#
# Architecture:
#   - whisper-service-v2 worker calls this service *after* ASR (in processFile)
#   - Only invoked when target_language is provided by the user
#   - Uses NLLB-200 600M int8 (good quality, ~1.4 GB on disk, fast CPU inference)
#
# Deployment order:
#   1. kubectl apply -k kubernetes/overlays/testcrash-pub -n debugging-testcrash-pub
#      (this file is now included in the kustomize base)
#   2. Download the model ONCE:
#      kubectl create -f kubernetes/base/translation-service-downloader-job.yaml -n debugging-testcrash-pub
#   3. Watch logs:
#      kubectl logs -f job/<generated-name> -n debugging-testcrash-pub
#
# The service will be available at:
#   http://translation-service.debugging-testcrash-pub.svc.cluster.local:8001/v1/translate
#
# Image (build once, push to your Harbor):
#   cd whisper-service-v2/translation-service
#   docker build -t harbor.dev.takatan.cloud/devcenter/translation-service:latest .
#   docker push harbor.dev.takatan.cloud/devcenter/translation-service:latest

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: translation-service-models-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi   # NLLB-600M HF (~2.4GB) + ct2 int8 (~1.4GB) + temp space

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: translation-service-download-scripts
data:
  download-translation-model.sh: |
    #!/bin/bash
    # =============================================================================
    # translation-service model downloader + CTranslate2 converter
    # =============================================================================
    # CRITICAL (per AGENTS.md):
    #   - Must run only as a Kubernetes Job with the PVC mounted.
    #   - Downloads + converts ONCE (marker file prevents re-download).
    #   - Never run on laptop (models are large).
    # =============================================================================
    set -euo pipefail

    echo "=============================================================="
    echo "[translation-downloader] START at $(date -Iseconds)"
    echo "=============================================================="

    MODEL_NAME="${NLLB_MODEL:-facebook/nllb-200-distilled-600M}"
    HF_CACHE="${HF_HOME:-/models/translation/hf-cache}"
    CT2_OUT="${CT2_MODEL_DIR:-/models/translation/ct2/nllb-200-distilled-600M-int8}"

    mkdir -p "$HF_CACHE" "$CT2_OUT"

    # Marker prevents re-download / re-conversion
    if [ -f "$CT2_OUT/.ready" ]; then
      echo "[translation-downloader] Model already present and ready at $CT2_OUT — skipping."
      exit 0
    fi

    echo "[translation-downloader] Installing Python dependencies (one-time)..."
    pip install --no-cache-dir -q \
        huggingface_hub \
        ctranslate2 \
        transformers \
        torch \
        sentencepiece

    echo "[translation-downloader] >>> Downloading $MODEL_NAME to $HF_CACHE ..."
    python3 - <<-'PYEOF'
    import os
    from huggingface_hub import snapshot_download

    model = os.environ.get("NLLB_MODEL", "facebook/nllb-200-distilled-600M")
    hf = os.environ.get("HF_HOME", "/models/translation/hf-cache")
    print(f"Downloading {model} ...")
    snapshot_download(
        repo_id=model,
        cache_dir=hf,
        local_dir=os.path.join(hf, model),
        local_dir_use_symlinks=False,
        resume_download=True,
    )
    print("HF download complete.")
    PYEOF

    echo "[translation-downloader] >>> Converting to CTranslate2 INT8 → $CT2_OUT"
    ct2-transformers-converter \
      --model "$HF_CACHE/$MODEL_NAME" \
      --output_dir "$CT2_OUT" \
      --quantization int8 \
      --force

    touch "$CT2_OUT/.ready"
    echo "[translation-downloader] SUCCESS — model ready at $CT2_OUT"
    echo "=============================================================="
    date -Iseconds
    echo "=============================================================="

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: translation-service
  labels:
    app: translation-service
spec:
  replicas: 1          # Translation is fast; 1 replica is sufficient (ASR workers are the bottleneck)
  selector:
    matchLabels:
      app: translation-service
  template:
    metadata:
      labels:
        app: translation-service
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: translation-service
          image: harbor.dev.takatan.cloud/devcenter/translation-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: MODEL_PATH
              value: "/models/translation/ct2/nllb-200-distilled-600M-int8"
            - name: NUM_THREADS
              value: "4"
            - name: INTER_THREADS
              value: "2"
            - name: PORT
              value: "8001"
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
          resources:
            # Tuned for debugging-testcrash-pub (tight 12 CPU HRQ)
            requests:
              cpu: "300m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: translation-service-models-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: translation-service
  labels:
    app: translation-service
spec:
  selector:
    app: translation-service
  ports:
    - name: http
      port: 8001
      targetPort: 8001
  type: ClusterIP
