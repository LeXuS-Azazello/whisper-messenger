apiVersion: apps/v1
kind: Deployment
metadata:
  name: openvoice
  namespace: debugging-testcrash-pub
  labels:
    app: openvoice
spec:
  replicas: 0
  selector:
    matchLabels:
      app: openvoice
  template:
    metadata:
      labels:
        app: openvoice
    spec:
      containers:
      - name: openvoice-api
        image: python:3.10-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          echo "Installing system dependencies..."
          apt-get update && apt-get install -y --no-install-recommends ffmpeg git wget libsndfile1
          pip install --no-cache-dir --upgrade pip
          pip install --no-cache-dir torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir fastapi "uvicorn[standard]" python-multipart numpy
          echo "Cloning OpenVoice V2..."
          git clone https://github.com/myshell-ai/OpenVoice.git /app/OpenVoice
          cd /app/OpenVoice
          pip install -r requirements.txt
          echo "Starting OpenVoice API..."
          # We use a custom wrapper or the provided examples as an API
          # For production deployment, usually a separate wrapper is needed. 
          # This is a startup shell to ensure environment is ready.
          python -m uvicorn main:app --host 0.0.0.0 --port 50002
        ports:
        - containerPort: 50002
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "1000m"
            memory: "4Gi"
        volumeMounts:
        - name: cache-vol
          mountPath: /root/.cache
      volumes:
      - name: cache-vol
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: openvoice
  namespace: debugging-testcrash-pub
spec:
  type: ClusterIP
  selector:
    app: openvoice
  ports:
  - port: 50002
    targetPort: 50002
    protocol: TCP
    name: http
