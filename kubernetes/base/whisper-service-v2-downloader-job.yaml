# whisper-service-v2 Model Downloader Job
#
# PURPOSE:
#   One-time (or on-demand) Job that downloads the large ASR models
#   (SenseVoice, Silero VAD, Punctuation) into the PVC used by whisper-service-v2.
#
# WHEN TO RUN:
#   - First time after deploying whisper-service-v2
#   - If models are corrupted or you want to re-download
#   - After changing the download script
#
# USAGE:
#   kubectl apply -f kubernetes/base/whisper-service-v2-downloader-job.yaml -n debugging-testcrash-pub
#
#   The Job uses generateName, so every run creates a new unique Job (good for logs).
#
#   To watch logs:
#   kubectl logs -f job/<the-generated-name> -n debugging-testcrash-pub
#
#   The improved download script (with clear PUNCTUATION errors, retries, etc.)
#   lives in the ConfigMap created by whisper-service-v2.yaml
#
# NOTES:
#   - This Job is intentionally NOT part of the regular base kustomization.
#   - Regular deploys (deploy.sh / kubectl apply -k) will NOT touch it.
#   - Models are downloaded at most once thanks to marker files in the script.

apiVersion: batch/v1
kind: Job
metadata:
  generateName: whisper-service-v2-model-downloader-
  namespace: debugging-testcrash-pub
  labels:
    app: whisper-service-v2
    component: model-downloader
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400   # keep the Job + logs for 24h for debugging
  template:
    metadata:
      labels:
        app: whisper-service-v2
        component: model-downloader
    spec:
      restartPolicy: OnFailure
      containers:
        - name: downloader
          image: curlimages/curl:latest
          command: ["/bin/sh", "/scripts/download-models.sh"]
          env:
            - name: MODELS_DIR
              value: "/models"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: whisper-service-v2-models-pvc
        - name: scripts
          configMap:
            name: whisper-service-v2-download-scripts
            defaultMode: 0755
