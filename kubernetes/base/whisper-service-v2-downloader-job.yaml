# whisper-service-v2 Model Downloader Job
#
# PURPOSE:
#   One-time (or on-demand) Job that downloads the large ASR models
#   (SenseVoice, Silero VAD, Punctuation) into the PVC used by whisper-service-v2.
#
# WHEN TO RUN:
#   - First time after deploying whisper-service-v2
#   - If models are corrupted or you want to re-download
#   - After changing the download script
#
# USAGE (IMPORTANT):
#   This file uses `generateName`, therefore you MUST use `create`, not `apply`.
#
#   Correct command:
#   kubectl create -f kubernetes/base/whisper-service-v2-downloader-job.yaml -n debugging-testcrash-pub
#
#   Why not `apply`?
#   `kubectl apply` does not support `generateName`. Every time you want to re-download
#   the models, run `create` again — it will create a fresh Job with a unique name.
#
#   To watch logs of the latest run:
#   kubectl logs -f job/<job-name-generated-by-k8s> -n debugging-testcrash-pub
#
#   Example of a real job name after creation:
#   whisper-service-v2-model-downloader-9k2m7
#
#   The improved download script (with clear PUNCTUATION errors, retries, etc.)
#   lives in the ConfigMap created by whisper-service-v2.yaml
#
# NOTES:
#   - This Job is intentionally NOT part of the regular base kustomization.
#   - Regular deploys (deploy.sh / kubectl apply -k) will NOT touch it.
#   - Models are downloaded at most once thanks to marker files in the script.

apiVersion: batch/v1
kind: Job
metadata:
  generateName: whisper-service-v2-model-downloader-
  namespace: debugging-testcrash-pub
  labels:
    app: whisper-service-v2
    component: model-downloader
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400   # keep the Job + logs for 24h for debugging
  template:
    metadata:
      labels:
        app: whisper-service-v2
        component: model-downloader
    spec:
      restartPolicy: OnFailure
      containers:
        - name: downloader
          image: debian:bookworm-slim
          command: ["/bin/bash", "-c", "apt-get update && apt-get install -y curl bzip2 ca-certificates && bash /scripts/download-models.sh"]
          envFrom:
          - secretRef:
              name: hf-token
          env:
            - name: MODELS_DIR
              value: "/models"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: scripts
              mountPath: /scripts
          resources:
            # Reduced for debugging-testcrash-pub 12 CPU HRQ
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: whisper-service-v2-models-pvc
        - name: scripts
          configMap:
            name: whisper-service-v2-download-scripts
            defaultMode: 0755
