apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: echo-frontend-network-policy
spec:
  podSelector:
    matchLabels:
      app: echo-frontend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {} # Allow from any pod in this namespace
    - ipBlock:
        cidr: 0.0.0.0/0 # Allow traffic from the LoadBalancer / Internet
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: mongodb
  - to:
    - podSelector:
        matchLabels:
          app: mongo-express
    ports:
      - protocol: TCP
        port: 8081
  - to:
    - podSelector:
        matchLabels:
          app: redis
  - to:
    - podSelector:
        matchLabels:
          app: tg-client-manager
    ports:
      - protocol: TCP
        port: 3000
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0 # Allow external internet access for Meta/Google APIs
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
