apiVersion: apps/v1
kind: Deployment
metadata:
  name: voicemsg-tester
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voicemsg-tester
  template:
    metadata:
      labels:
        app: voicemsg-tester
    spec:
      imagePullSecrets:
      - name: forgejo-pull-secret
      containers:
      - name: tester
        image: lexus/voicemsg-net:voicemsg-tester-latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: MONGODB_URI
          value: "mongodb://mongodb:27017/voicemsg"
        - name: MAIL_WORKER_URL
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: MAIL_WORKER_URL
              optional: true
        - name: MAIL_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: MAIL_API_TOKEN
              optional: true
        - name: ASR_SECRET
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: ASR_SECRET
              optional: true
        - name: ASR_PROVIDER
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: ASR_PROVIDER
              optional: true
        - name: SAMESAME_SECRET
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: SAMESAME_SECRET
              optional: true
        - name: SAMESAME_URL
          value: "http://samesame:8002"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1536Mi"
        volumeMounts:
        - name: tester-patch
          mountPath: /app/src/index.ts
          subPath: index.ts
        - name: tester-patch
          mountPath: /app/src/tests.ts
          subPath: tests.ts
        - name: tester-patch
          mountPath: /app/shared/samesame.js
          subPath: samesame.js
        - name: tester-patch
          mountPath: /app/test_audio.ogg
          subPath: test_audio.ogg
      volumes:
      - name: tester-patch
        configMap:
          name: voicemsg-tester-patch
---
apiVersion: v1
kind: Service
metadata:
  name: voicemsg-tester
spec:
  type: ClusterIP
  selector:
    app: voicemsg-tester
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
