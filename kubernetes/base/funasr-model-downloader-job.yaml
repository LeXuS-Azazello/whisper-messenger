# funasr Model Downloader Job
# One-time (or on-demand) Job that downloads the ASR models into the PVC used by the funasr Deployment.
apiVersion: batch/v1
kind: Job
metadata:
  name: funasr-model-downloader
  namespace: debugging-testcrash-pub
  labels:
    app: funasr
    component: model-downloader
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: funasr
        component: model-downloader
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: forgejo-pull-secret
      containers:
        - name: downloader
          image: forge.dev.takatan.cloud/lexus/voicemsg-net:funasr-latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "/scripts/funasr-download-models.sh"]
          env:
            - name: MODELS_DIR
              value: "/models"
            - name: HUGGINGFACE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: token
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: token
            - name: DOWNLOAD_TIMEOUT
              value: "1800"
            - name: FUNASR_MODEL_NAME
              value: "FunAudioLLM/Fun-ASR-MLT-Nano-2512"
            - name: FUNASR_VAD_MODEL
              value: "iic/speech_fsmn_vad_zh-cn-16k-common-pytorch"
            - name: FUNASR_PUNC_MODEL
              value: "iic/punc_ct-transformer_cn-en-common-vocab471067-large"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: funasr-model-pvc
        - name: scripts
          configMap:
            name: funasr-download-scripts
            defaultMode: 0755
