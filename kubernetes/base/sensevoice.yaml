apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensevoice
  namespace: debugging-testcrash-pub
  labels:
    app: sensevoice
spec:
  replicas: 0
  selector:
    matchLabels:
      app: sensevoice
  template:
    metadata:
      labels:
        app: sensevoice
    spec:
      containers:
        - name: sensevoice
          image: siyrs/sensevoice-api:latest
          env:
            - name: SENSEVOICE_DEVICE
              value: "cpu"
          ports:
            - containerPort: 50000
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "3000m"
              memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: sensevoice
  namespace: debugging-testcrash-pub
  labels:
    app: sensevoice
spec:
  selector:
    app: sensevoice
  ports:
    - name: http
      port: 50000
      targetPort: 50000
  type: ClusterIP
