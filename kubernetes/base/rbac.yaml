apiVersion: v1
kind: ServiceAccount
metadata:
  name: mtproto-bridge-sa
  namespace: debugging-testcrash-pub
imagePullSecrets:
- name: harbor-pull-secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-creator
  namespace: debugging-testcrash-pub
rules:
- apiGroups: [""]
  resources: ["pods", "services", "persistentvolumeclaims", "configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mtproto-manager-binding
  namespace: debugging-testcrash-pub
subjects:
- kind: ServiceAccount
  name: mtproto-bridge-sa
  namespace: debugging-testcrash-pub
- kind: User
  name: "debugging:debugging@debug.org.ua"
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: pod-creator
  apiGroup: rbac.authorization.k8s.io
