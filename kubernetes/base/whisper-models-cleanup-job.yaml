apiVersion: batch/v1
kind: Job
metadata:
  generateName: whisper-models-cleanup-
  namespace: debugging-testcrash-pub
  labels:
    app: whisper-service-v2
    component: models-cleanup
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: whisper-service-v2
        component: models-cleanup
    spec:
      restartPolicy: Never
      containers:
        - name: cleaner
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "=== Whisper models cleanup started at $(date -Iseconds) ==="
              echo "Before cleanup:"
              du -sh /models 2>/dev/null || true
              ls -lh /models/whisper/ 2>/dev/null || echo "  /models/whisper/ empty or missing"
              ls -lh /models/punctuation/ 2>/dev/null || echo "  /models/punctuation/ empty or missing"

              echo ""
              echo "Removing stale/partial files in /models/whisper/ and /models/punctuation/ ..."
              rm -rf /models/whisper/* /models/punctuation/* 2>/dev/null || true
              # keep the directories themselves so next download works cleanly
              mkdir -p /models/whisper /models/punctuation /models/vad

              echo ""
              echo "After cleanup:"
              ls -lh /models/whisper/ /models/punctuation/ 2>/dev/null || true
              echo ""
              echo "=== Cleanup finished successfully ==="
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: whisper-service-v2-models-pvc
