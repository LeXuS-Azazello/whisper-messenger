# CronJob: Clean up orphaned temp audio files from the shared PVC
# Runs every hour, deletes samesame_* and other stale audio files older than 2 hours
apiVersion: batch/v1
kind: CronJob
metadata:
  name: temp-media-cleanup
  namespace: debugging-testcrash-pub
spec:
  schedule: "0 * * * *"  # Every hour
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cleaner
              image: alpine:3.19
              command: ["/bin/sh", "-c"]
              args:
                - |
                  echo "=== Temp Media Cleanup $(date) ==="
                  # Delete samesame output files older than 2 hours
                  find /temporaly-media-msg -maxdepth 1 -name "samesame_out_*" -mmin +120 -delete -print 2>/dev/null | wc -l | xargs -I{} echo "Deleted {} samesame output files"
                  # Delete samesame prompt files older than 2 hours
                  find /temporaly-media-msg -maxdepth 1 -name "samesame_prompt_*" -mmin +120 -delete -print 2>/dev/null | wc -l | xargs -I{} echo "Deleted {} samesame prompt files"
                  # Delete warmup files
                  find /temporaly-media-msg -maxdepth 1 -name "warmup_*" -mmin +30 -delete -print 2>/dev/null | wc -l | xargs -I{} echo "Deleted {} warmup files"
                  # Delete any orphaned .wav/.ogg files older than 3 hours (safety net)
                  find /temporaly-media-msg -maxdepth 1 \( -name "*.wav" -o -name "*.ogg" -o -name "*.oga" \) -mmin +180 -delete -print 2>/dev/null | wc -l | xargs -I{} echo "Deleted {} orphaned audio files"
                  echo "Cleanup done"
              resources:
                requests:
                  cpu: "10m"
                  memory: "16Mi"
                limits:
                  cpu: "50m"
                  memory: "32Mi"
              volumeMounts:
                - name: temp-media
                  mountPath: /temporaly-media-msg
          volumes:
            - name: temp-media
              persistentVolumeClaim:
                claimName: temporaly-media-msg
