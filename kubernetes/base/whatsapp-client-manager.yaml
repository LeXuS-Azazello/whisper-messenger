apiVersion: apps/v1
kind: Deployment
metadata:
  name: whatsapp-client-manager
  namespace: debugging-testcrash-pub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whatsapp-client-manager
  template:
    metadata:
      labels:
        app: whatsapp-client-manager
    spec:
      serviceAccountName: whatsapp-client-manager-sa
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: manager
          image: harbor.dev.takatan.cloud/devcenter/whatsapp-client-manager:latest
          imagePullPolicy: Always
          command: ["node", "index.js"]
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: whisper-messenger-env
          env:
            - name: MODE
              value: "MANAGER"
            - name: MANAGER_API_SERVER
              value: "https://kube-api.kube-dc.cloud:6443"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WHATSAPP_CLIENT_IMAGE
              value: "harbor.dev.takatan.cloud/devcenter/whatsapp-client:latest"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: MONGODB_URI
              value: "mongodb://mongodb:27017/voicemsg"
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: whatsapp-client-manager
  namespace: debugging-testcrash-pub
spec:
  selector:
    app: whatsapp-client-manager
  ports:
    - port: 3000
      targetPort: 3000
