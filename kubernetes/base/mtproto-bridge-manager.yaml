apiVersion: v1
kind: ServiceAccount
metadata:
  name: mtproto-bridge-sa
  namespace: debugging-testcrash-pub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-manager-role
  namespace: debugging-testcrash-pub
rules:
- apiGroups: [""]
  resources: ["pods", "persistentvolumeclaims", "services"]
  verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mtproto-bridge-rb
  namespace: debugging-testcrash-pub
subjects:
- kind: ServiceAccount
  name: mtproto-bridge-sa
  namespace: debugging-testcrash-pub
roleRef:
  kind: Role
  name: pod-manager-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtproto-bridge-manager
  namespace: debugging-testcrash-pub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mtproto-bridge-manager
  template:
    metadata:
      labels:
        app: mtproto-bridge-manager
    spec:
      serviceAccountName: mtproto-bridge-sa
      containers:
      - name: mtproto-bridge
        image: azazellosaraksh/whisper-bridge-manager:latest
        imagePullPolicy: Always
        command: ["node", "index.js"]
        ports:
        - containerPort: 3000
        env:
        - name: MODE
          value: "MANAGER"
        - name: TG_API_ID
          value: "13867088"
        - name: TG_API_HASH
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: TELEGRAM_APP_HASH
        - name: BRIDGE_SECRET
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: BRIDGE_SECRET
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: QWEN_ASR_URL
          value: "http://qwen3-asr:11434"
        - name: MONGODB_URI
          value: "mongodb://mongodb:27017/voicemsg"
        - name: TG_CLIENT_IMAGE
          value: "azazellosaraksh/whisper-tg-client:latest"
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: mtproto-bridge-manager
  namespace: debugging-testcrash-pub
spec:
  selector:
    app: mtproto-bridge-manager
  ports:
  - port: 3000
    targetPort: 3000
