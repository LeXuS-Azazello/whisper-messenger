apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: samesame-model-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: samesame
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: samesame
  template:
    metadata:
      labels:
        app: samesame
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: samesame
          image: harbor.dev.takatan.cloud/azazellosaraksh/samesame:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: TTS_MODEL_DIR
              value: "/models"
            - name: HF_HOME
              value: "/models"
            - name: HUGGINGFACE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: HUGGING_FACE_HUB_TOKEN
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: HUGGING_FACE_HUB_TOKEN
            - name: SAMESAME_SECRET
              valueFrom:
                secretKeyRef:
                  name: whisper-messenger-env
                  key: SAMESAME_SECRET
            - name: SAMESAME_LOCAL_ONLY
              value: "true"
            - name: SAMESAME_MODEL_NAME
              value: "iic/CosyVoice2-0.5B"
            - name: COQUI_TOS_AGREED
              value: "1"
          resources:
            # Optimized: reduced CPU to fit cluster quota while retaining speed
            requests:
              cpu: "1.5"
              memory: "4Gi"
            limits:
              cpu: "1.5"
              memory: "8Gi"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: samesame-app-py-vol
              mountPath: /app/app.py
              subPath: app.py
              
          # Readiness: fails (503) until the downloader Job has populated the models.
          # This keeps the pod out of load-balancing until it can actually serve requests.
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 100   # allow very long downloads (first time can be 20-40 min)

          # Liveness: always returns 200 (/live) so the pod is not restarted while the
          # downloader Job is still writing the (very large) TTS models into the PVC.
          livenessProbe:
            httpGet:
              path: /live
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 100
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: samesame-model-cache
        - name: samesame-app-py-vol
          configMap:
            name: samesame-app-py
---
apiVersion: v1
kind: Service
metadata:
  name: samesame
spec:
  selector:
    app: samesame
  ports:
    - name: http
      port: 8002
      targetPort: 8002
  type: ClusterIP
