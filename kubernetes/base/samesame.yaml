apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: samesame-model-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: samesame-download-scripts
data:
  download-models.sh: |
    #!/bin/sh
    set -eu

    MODELS_DIR="${MODELS_DIR:-/models}"
    echo "[samesame-downloader] MODELS_DIR=$MODELS_DIR"
    mkdir -p "$MODELS_DIR"

    python /app/download_model.py "$MODELS_DIR"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: samesame
spec:
  replicas: 1
  selector:
    matchLabels:
      app: samesame
  template:
    metadata:
      labels:
        app: samesame
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: samesame
          image: harbor.dev.takatan.cloud/devcenter/samesame:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: TTS_MODEL_DIR
              value: "/models"
            - name: HF_HOME
              value: "/models"
            - name: HUGGINGFACE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: HUGGING_FACE_HUB_TOKEN
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: HUGGING_FACE_HUB_TOKEN
            - name: SAMESAME_SECRET
              valueFrom:
                secretKeyRef:
                  name: samesame-secret
                  key: SAMESAME_SECRET
            - name: SAMESAME_LOCAL_ONLY
              value: "true"
            - name: SAMESAME_MODEL_NAME
              value: "tts_models/multilingual/multi-dataset/your_tts"
            - name: SAMESAME_VOCODER_NAME
              value: "vocoder_models/universal/libritts/fullband-melgan"
          resources:
            # Reduced to 1 CPU for debugging-testcrash-pub 12 CPU HRQ
            requests:
              cpu: "800m"
              memory: "2Gi"
            limits:
              cpu: "1"
              memory: "4Gi"
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 10
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: samesame-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: samesame
spec:
  selector:
    app: samesame
  ports:
    - name: http
      port: 8002
      targetPort: 8002
  type: ClusterIP
