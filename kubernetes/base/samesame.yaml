apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: samesame
  name: samesame
  namespace: debugging-testcrash-pub
spec:
  imagePullSecrets:
    - name: harbor-pull-secret
  replicas: 1
  selector:
    matchLabels:
      app: samesame
  template:
    metadata:
      labels:
        app: samesame
    spec:
      containers:
        - env:
          - name: TTS_MODEL_DIR
            value: "/models"
          - name: HF_HOME
            value: "/models"
          - name: HUGGINGFACE_API_KEY
            valueFrom:
              secretKeyRef:
                key: token
                name: huggingface-token
          - name: SAMESAME_SECRET
            valueFrom:
              secretKeyRef:
                key: SAMESAME_SECRET
                name: voicemsg-secrets
          - name: SAMESAME_MODEL_NAME
            value: "FunAudioLLM/Fun-CosyVoice3-0.5B-2512"
          image: harbor.dev.takatan.cloud/azazellosaraksh/samesame:latest
          imagePullPolicy: IfNotPresent
          name: samesame
          ports:
            - containerPort: 8002
          resources:
            requests:
              cpu: "1.5"
              memory: "4Gi"
            limits:
              cpu: "1.5"
              memory: "8Gi"
          volumeMounts:
            - mountPath: "/models"
              name: models
        initContainers:
          - command:
            - modelscope
            - download
            -- -model_id
            - "FunAudioLLM/Fun-CosyVoice3-0.5B-2512"
            -- -cache_dir
            - "/models"
          name: download-models
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - mountPath: "/models"
              name: models
        volumes:
          - name: models
            persistentVolumeClaim:
              claimName: samesame-model-cache
  strategy:
    type: RollingUpdate
