apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: samesame
  name: samesame
  namespace: debugging-testcrash-pub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: samesame
  template:
    metadata:
      labels:
        app: samesame
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: forgejo-pull-secret
      containers:
        - env:
            - name: TTS_MODEL_DIR
              value: "/models"
            - name: HF_HOME
              value: "/models"
            - name: HUGGINGFACE_API_KEY
              valueFrom:
                secretKeyRef:
                  key: token
                  name: huggingface-token
            - name: MODELSCOPE_CACHE
              value: "/models"
            - name: SAMESAME_SECRET
              valueFrom:
                secretKeyRef:
                  key: SAMESAME_SECRET
                  name: voicemsg-secrets
            - name: SAMESAME_MODEL_NAME
              value: "FunAudioLLM/Fun-CosyVoice3-0.5B-2512"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: PROMPT_CACHE_TTL
              value: "21600"
            - name: CPU_THREADS
              value: "4"
            - name: FUNASR_URL
              value: "http://funasr:8000"
            - name: SAMESAME_TEMP_DIR
              value: "/temporaly-media-msg"
          image: forge.dev.takatan.cloud/lexus/voicemsg-net:samesame-latest
          imagePullPolicy: Always
          name: samesame
          ports:
            - containerPort: 8002
          resources:
            requests:
              cpu: "2"
              memory: "3Gi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "3"
              memory: "6Gi"
              ephemeral-storage: "3Gi"
          startupProbe:
            httpGet:
              path: /health
              port: 8002
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - mountPath: "/models"
              name: models
            - mountPath: "/dev/shm"
              name: shm
            - mountPath: "/temporaly-media-msg"
              name: temp-media
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: samesame-model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: temp-media
          persistentVolumeClaim:
            claimName: temporaly-media-msg
---
apiVersion: v1
kind: Service
metadata:
  name: samesame
  namespace: debugging-testcrash-pub
spec:
  selector:
    app: samesame
  ports:
    - port: 8002
      targetPort: 8002