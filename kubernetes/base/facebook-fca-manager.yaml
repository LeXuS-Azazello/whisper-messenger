apiVersion: v1
kind: ConfigMap
metadata:
  name: fca-pod-template
data:
  pod-template.json: |
    {
      "apiVersion": "v1",
      "kind": "Pod",
      "metadata": {
        "name": "fca-user",
        "labels": {
          "app": "facebook-fca-client"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "facebook-fca-client",
            "image": "lexusazazello/facebook-fca-client:latest",
            "imagePullPolicy": "IfNotPresent",
            "env": [
              {
                "name": "FUNASR_URL",
                "value": "http://funasr:50001"
              },
              {
                "name": "REDIS_URL",
                "value": "redis://redis:6379"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "512Mi"
              }
            }
          }
        ],
        "imagePullSecrets": [
          {
            "name": "dockerhub-pull-secret"
          }
        ],
        "restartPolicy": "Never"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: facebook-fca-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: facebook-fca-manager
  template:
    metadata:
      labels:
        app: facebook-fca-manager
    spec:
      serviceAccountName: voicemsg-client-manager
      imagePullSecrets:
        - name: forgejo-pull-secret
      containers:
      - name: manager
        image: lexusazazello/voicemsg:facebook-fca-manager-latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3003
        env:
        - name: MODE
          value: "MANAGER"
        - name: PORT
          value: "3003"
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: MANAGER_SECRET
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: MONGODB_URI
          value: "mongodb://mongodb:27017/voicemsg"
---
apiVersion: v1
kind: Service
metadata:
  name: facebook-fca-manager
spec:
  selector:
    app: facebook-fca-manager
  ports:
  - port: 3003
    targetPort: 3003
