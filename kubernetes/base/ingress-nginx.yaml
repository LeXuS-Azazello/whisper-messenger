# Ingress Controller - serves as the entry point for voicemsg.net
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingress-nginx
  namespace: debugging-testcrash-pub
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-nginx
  namespace: debugging-testcrash-pub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingress-nginx
  template:
    metadata:
      labels:
        app: ingress-nginx
    spec:
      imagePullSecrets:
      - name: harbor-pull-secret
      serviceAccountName: ingress-nginx
      containers:
      - name: nginx
        image: registry.k8s.io/ingress-nginx/controller:v1.15.1
        args:
         - /nginx-ingress-controller
         - --election-id=ingress-nginx-leader
         - --controller-class=k8s.io/ingress-nginx
         - --ingress-class=nginx
         - --watch-namespace=$(POD_NAMESPACE)
         - --publish-service=$(POD_NAMESPACE)/ingress-nginx-controller
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - name: http
          containerPort: 80
        - name: https
          containerPort: 443
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ingress-nginx-controller
  namespace: debugging-testcrash-pub
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: https
    port: 443
    targetPort: 443
    protocol: TCP
  selector:
    app: ingress-nginx