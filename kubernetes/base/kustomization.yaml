apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - frontend.yaml
  - frontend-network-policy.yaml
  - redis.yaml
  - mongodb.yaml
  - mongo-express.yaml
  - network-policy.yaml
  - tg-client-manager.yaml
  - tg-client.yaml
  - whisper-service-v2.yaml
  - whisper-service-network-policy.yaml
  - samesame.yaml
  - samesame-secret.yaml
  - huggingface-secret.yaml
  - rbac.yaml
  - cert-manager.yaml
  - voicemsg-cf.yaml
  - voicemsg-tester.yaml
  - whatsapp-baileys-manager.yaml
  - facebook-fca-manager.yaml
  - instagram-fca-manager.yaml
  - rbac-whisper-exec.yaml
  - sensevoice.yaml
  - funasr.yaml



images:
  - name: mongo
    newName: harbor.dev.takatan.cloud/azazellosaraksh/mongo
    newTag: latest
  - name: redis
    newName: harbor.dev.takatan.cloud/azazellosaraksh/redis
    newTag: 7-alpine
  - name: mongo-express
    newName: harbor.dev.takatan.cloud/azazellosaraksh/mongo-express
    newTag: latest

namespace: debugging-testcrash-pub

configMapGenerator:
  - name: whisper-service-v2-download-scripts
    files:
      - download-models.sh=scripts/whisper-download-models.sh
  - name: samesame-download-scripts
    files:
      - download-models.sh=scripts/samesame-download-models.sh
  - name: samesame-app-py
    files:
      - app.py=app.py
generatorOptions:
  disableNameSuffixHash: true
