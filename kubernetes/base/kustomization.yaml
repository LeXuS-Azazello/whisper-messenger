apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - frontend.yaml
  - redis.yaml
  - mongodb.yaml
  - mongo-express.yaml
  - tg-client-manager.yaml
  - tg-client.yaml
  - samesame.yaml
  - huggingface-secret.yaml
  - rbac.yaml
  - cert-manager.yaml
  - voicemsg-cf.yaml
  - voicemsg-tester.yaml
  - whatsapp-baileys-manager.yaml
  # - facebook-fca-manager.yaml
  # - instagram-fca-manager.yaml
  - funasr.yaml



namespace: debugging-testcrash-pub

configMapGenerator:
  - name: samesame-download-scripts
    files:
      - download-models.sh=./scripts/samesame-download-models.sh
  - name: funasr-download-scripts
    files:
      - funasr-download-models.sh=./scripts/funasr-download-models.sh
  - name: funasr-server
    files:
      - server.py=./funasr-server.py
  - name: samesame-app-py
    files:
      - app.py=./app.py
generatorOptions:
  disableNameSuffixHash: true
