apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - frontend.yaml
  - redis.yaml
  - mongodb.yaml
  - mongo-express.yaml
  - tg-client-manager.yaml
  - telegram-bot.yaml
  - payment-bot.yaml
  - tg-client.yaml
  - temporaly-media-msg.yaml
  - huggingface-secret.yaml
  - rbac.yaml
  - cert-manager.yaml
  - voicemsg-cf.yaml
  - voicemsg-tester.yaml
  - whatsapp-baileys-manager.yaml
  - facebook-fca-manager.yaml
  - instagram-fca-manager.yaml
  - funasr.yaml



namespace: debugging-testcrash-pub

configMapGenerator:
  - name: xtts-download-scripts
    files:
      - download-models.sh=./scripts/xtts-download-models.sh
  - name: funasr-download-scripts
    files:
      - funasr-download-models.sh=./scripts/funasr-download-models.sh
generatorOptions:
  disableNameSuffixHash: true
