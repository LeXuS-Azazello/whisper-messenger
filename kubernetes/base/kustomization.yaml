apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - frontend.yaml
  - frontend-network-policy.yaml
  - redis.yaml
  - mongodb.yaml
  - mongo-express.yaml
  - network-policy.yaml
  - tg-client-manager.yaml
  - tg-client.yaml
  - whisper-service-v2.yaml
  - whisper-service-network-policy.yaml
  - samesame.yaml
  - samesame-secret.yaml
  - huggingface-secret.yaml
  - rbac.yaml
  - cert-manager.yaml
  - voicemsg-cf.yaml
  - voicemsg-tester.yaml
  - whatsapp-baileys-manager.yaml
  - facebook-fca-manager.yaml
  - instagram-fca-manager.yaml
