apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mtproto-bridge-network-policy
  namespace: debugging-testcrash-pub
spec:
  podSelector:
    matchLabels:
      app: tg-user-bridge
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: mtproto-bridge-manager
  egress:
  - to:
    - podSelector: {} # Allow all pods in the same namespace
    ports:
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 8000

  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
