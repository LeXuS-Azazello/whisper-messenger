apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tg-client-manager-network-policy
spec:
  podSelector:
    matchExpressions:
    - {key: app, operator: In, values: [tg-client-user]}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: mongodb
    ports:
      - protocol: TCP
        port: 27017
  - to:
    - namespaceSelector: {}
    ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 6443 # K8s API
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0 # Allow all egress for Telegram/external APIs and cluster API access
