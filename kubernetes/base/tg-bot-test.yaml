apiVersion: apps/v1
kind: Deployment
metadata:
  name: tg-bot-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tg-bot-test
  template:
    metadata:
      labels:
        app: tg-bot-test
    spec:
      imagePullSecrets:
      - name: harbor-pull-secret
      containers:
      - name: tg-bot
        image: harbor.dev.takatan.cloud/devcenter/whisper-tg-client-manager:latest
        env:
        - name: MODE
          value: "BOT"
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: TELEGRAM_BOT_TOKEN
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: WHISPER_PROVIDER
          value: "http://whisper-turbo.debugging-testcrash-pub.svc.cluster.local:8000"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
