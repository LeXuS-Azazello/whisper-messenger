apiVersion: batch/v1
kind: Job
metadata:
  name: samesame-model-cleanup
  namespace: debugging-testcrash-pub
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: cleaner
          image: alpine:3.19
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "=== Cleaning samesame-model-cache PVC ==="
              # Keep only required models
              find /models -type d -name "*.old" -exec rm -rf {} \; 2>/dev/null || true
              find /models -type d -name "sensevoice*" -exec rm -rf {} \; 2>/dev/null || true
              echo "Cleanup done"
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: samesame-model-cache