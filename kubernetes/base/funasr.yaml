apiVersion: apps/v1
kind: Deployment
metadata:
  name: funasr
  namespace: debugging-testcrash-pub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: funasr
  template:
    metadata:
      labels:
        app: funasr
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      initContainers:
        - name: download-models
          image: harbor.dev.takatan.cloud/azazellosaraksh/modelscope-runner:latest
          command:
            - "modelscope"
            - "download"
            - "--model_id"
            - "FunAudioLLM/Fun-ASR-MLT-Nano-2512"
            - "--cache_dir"
            - "/models"
          env:
            - name: MODELSCOPE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: modelscope-token
                  key: MODELSCOPE_TOKEN
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
      containers:
        - name: funasr-api
          image: harbor.dev.takatan.cloud/azazellosaraksh/funasr:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50001
          env:
            - name: FUNASR_MODEL
              value: "FunAudioLLM/Fun-ASR-MLT-Nano-2512"
            - name: FUNASR_DEVICE
              value: "cpu"
            - name: FUNASR_MODEL_PATH
              value: "/models"
          volumeMounts:
            - name: models
              mountPath: "/models"
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: samesame-model-cache

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: funasr-model-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path
