apiVersion: apps/v1
kind: Deployment
metadata:
  name: funasr
  namespace: debugging-testcrash-pub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: funasr
  template:
    metadata:
      labels:
        app: funasr
    spec:
      imagePullSecrets:
        - name: dockerhub-pull-secret
      containers:
        - name: funasr-api
          image: lexusazazello/voicemsg:funasr-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50001
          readinessProbe:
            httpGet:
              path: /ready
              port: 50001
            initialDelaySeconds: 180
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 60
          env:
            - name: FUNASR_WORKERS
              value: "1"
            - name: FUNASR_MODEL
              value: "FunAudioLLM/Fun-ASR-MLT-Nano-2512"
            - name: FUNASR_DEVICE
              value: "cpu"
            - name: FUNASR_NCPU
              value: "4" # Добавлено: под лимиты CPU
            - name: FUNASR_MODEL_PATH
              value: "/models/FunAudioLLM/Fun-ASR-MLT-Nano-2512"
            - name: FUNASR_VAD_MODEL_PATH
              value: "/models/iic/speech_fsmn_vad_zh-cn-16k-common-pytorch"
            - name: FUNASR_PUNC_MODEL_PATH
              value: "/models/iic/punc_ct-transformer_cn-en-common-vocab471067-large"
            - name: FUNASR_DISABLE_UPDATE
              value: "true"
          resources:
            requests:
              cpu: "1"
              memory: "10Gi"
            limits:
              cpu: "2"
              memory: "32Gi"
          volumeMounts:
            - name: models
              mountPath: "/models"
            - name: funasr-server-patch
              mountPath: "/app/server.py"
              subPath: "server.py"
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: funasr-model-pvc
        - name: funasr-server-patch
          configMap:
            name: funasr-server
---
apiVersion: v1
kind: Service
metadata:
  name: funasr
  namespace: debugging-testcrash-pub
spec:
  selector:
    app: funasr
  ports:
    - port: 50001
      targetPort: 50001
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: funasr-model-pvc
  namespace: debugging-testcrash-pub
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: local-path