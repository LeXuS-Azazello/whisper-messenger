# XTTS Model Downloader Job
# One-time (or on-demand) Job that downloads the XTTS model into the PVC used by the xtts Deployment.
apiVersion: batch/v1
kind: Job
metadata:
  name: xtts-model-downloader
  namespace: debugging-testcrash-pub
  labels:
    app: xtts
    component: model-downloader
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: xtts
        component: model-downloader
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: forgejo-pull-secret
      containers:
        - name: downloader
          image: ghcr.io/coqui-ai/tts-cpu:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "/scripts/download-models.sh"]
          env:
            - name: MODELS_DIR
              value: "/models"
            - name: HF_HOME
              value: "/models"
            - name: COQUI_TOS_AGREED
              value: "1"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: samesame-model-cache
        - name: scripts
          configMap:
            name: xtts-download-scripts
            defaultMode: 0755