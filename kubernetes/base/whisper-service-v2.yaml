---
# Whisper Service v2: sherpa-onnx Whisper large-v3-turbo int8 + Silero VAD
# CPU-only deployment for debugging-testcrash-pub (namespace: debugging-testcrash-pub)
#
# Model downloader Job is in a separate file (Jobs are not declarative):
#   kubectl create -f kubernetes/base/whisper-service-v2-downloader-job.yaml -n debugging-testcrash-pub
#
# This will download ~1.6 GB of models into the PVC on the first run.
# Subsequent runs are instant (marker files).


apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whisper-service-v2-models-pvc
  namespace: debugging-testcrash-pub
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: whisper-service-v2-download-scripts
  namespace: debugging-testcrash-pub
data:
  download-models.sh: |
    #!/bin/sh
    # =============================================================================
    # whisper-service-v2 model downloader (embedded copy — must match scripts/download-models.sh)
    # =============================================================================
    # CRITICAL RULES (per AGENTS.md):
    # - Runs ONLY inside Kubernetes Job + PVC. NEVER on laptop.
    # - Downloads happen at most ONCE (marker files).
    # =============================================================================
    set -euo pipefail

    echo "=============================================================="
    echo "[download-models] START at $(date -Iseconds)"
    echo "[download-models] MODELS_DIR=${MODELS_DIR:-/models}"
    echo "=============================================================="

    MODELS_DIR="${MODELS_DIR:-/models}"

    mkdir -p "$MODELS_DIR/whisper" "$MODELS_DIR/vad"

    BASE="https://github.com/k2-fsa/sherpa-onnx/releases/download"

    # --- helper: single file (Silero VAD) ----------------------------------------
    download_if_missing() {
      local url="$1"
      local out="$2"

      if [ -f "$out" ]; then
        echo "[download-models] SKIP (exists): $out"
        return 0
      fi

      echo "[download-models] DOWNLOADING (single file): $url → $out"
      if ! curl -L --fail --retry 8 --retry-delay 5 --max-time 300 -o "$out" "$url"; then
        echo "[download-models] FATAL: failed to download $url after retries" >&2
        exit 1
      fi
      echo "[download-models] SUCCESS: $out"
    }

    # --- helper: tar.bz2 archive (Whisper turbo etc.) ----------------------------
    download_tar_if_missing() {
      local url="$1"
      local dest_dir="$2"
      local marker="$3"
      local name="$4"

      if [ -f "$marker" ]; then
        size=$(stat -c%s "$marker" 2>/dev/null || echo 0)
        if [ "$size" -gt 100000000 ]; then
          echo "[download-models] SKIP (exists and valid, ${size} bytes): $marker  [$name]"
          return 0
        else
          echo "[download-models] WARNING: $marker exists but too small (${size} bytes) — will re-download"
          rm -f "$marker"
        fi
      fi

      echo "[download-models] DOWNLOADING ARCHIVE ($name): $url"
      tmp="$(mktemp)"
      if ! curl -L --fail --retry 8 --retry-delay 5 --max-time 600 -o "$tmp" "$url"; then
        echo "[download-models] FATAL: failed to download archive $url after retries" >&2
        rm -f "$tmp"
        exit 1
      fi

      echo "[download-models] EXTRACTING $name into $dest_dir ..."
      tar -xjf "$tmp" -C "$dest_dir" --strip-components=1
      find "$dest_dir" -mindepth 2 -type f -exec mv {} "$dest_dir"/ \; 2>/dev/null || true
      find "$dest_dir" -mindepth 1 -type d -exec rm -rf {} + 2>/dev/null || true
      rm -f "$tmp"
      echo "[download-models] SUCCESS: $name extracted (marker: $marker)"
    }

    # 1. Whisper large-v3-turbo int8 — official sherpa-onnx export
    #    Best quality + LID for 99+ languages (Russian, Hebrew, Arabic, etc.)
    echo "[download-models] >>> Downloading Whisper turbo int8 (large-v3-turbo) ..."
    download_tar_if_missing \
      "${BASE}/asr-models/sherpa-onnx-whisper-turbo.tar.bz2" \
      "$MODELS_DIR/whisper" \
      "$MODELS_DIR/whisper/turbo-encoder.int8.onnx" \
      "Whisper turbo int8 (large-v3-turbo)"

    # 2. Silero VAD (required for voice activity detection)
    #    Direct single-file download as requested
    download_if_missing \
      "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx" \
      "$MODELS_DIR/vad/silero_vad.onnx"

    # 3. English Online Punctuation + Truecasing (cnn-bilstm, very small + high quality for English)
    echo "[download-models] >>> Downloading English punctuation (online cnn-bilstm int8) ..."
    download_tar_if_missing \
      "${BASE}/punctuation-models/sherpa-onnx-online-punct-en-2024-08-06.tar.bz2" \
      "$MODELS_DIR/punctuation" \
      "$MODELS_DIR/punctuation/model.int8.onnx" \
      "English Online Punctuation + Truecase (int8)"

    echo "[download-models] All downloads attempted. Running final verification ..."

    # --- strict verification ----------------------------------------------------
    missing=0

    if [ ! -f "$MODELS_DIR/whisper/turbo-encoder.int8.onnx" ] || \
       [ ! -f "$MODELS_DIR/whisper/turbo-decoder.int8.onnx" ] || \
       ( [ ! -f "$MODELS_DIR/whisper/tokens.txt" ] && [ ! -f "$MODELS_DIR/whisper/turbo-tokens.txt" ] ); then
      echo "[download-models] ERROR: Whisper turbo int8 files missing!" >&2
      echo "  Expected in $MODELS_DIR/whisper/ : turbo-encoder.int8.onnx, turbo-decoder.int8.onnx, tokens.txt or turbo-tokens.txt" >&2
      missing=1
    else
      echo "[download-models] OK: Whisper turbo int8 (large-v3-turbo)"
    fi

    if [ ! -f "$MODELS_DIR/vad/silero_vad.onnx" ]; then
      echo "[download-models] ERROR: Silero VAD missing!" >&2
      echo "  Expected: $MODELS_DIR/vad/silero_vad.onnx" >&2
      missing=1
    else
      echo "[download-models] OK: VAD"
    fi

    if [ -f "$MODELS_DIR/punctuation/model.int8.onnx" ] && [ -f "$MODELS_DIR/punctuation/bpe.vocab" ]; then
      echo "[download-models] OK: Punctuation (English cnn-bilstm int8 + truecasing)"
    elif [ -f "$MODELS_DIR/punctuation/model.onnx" ] && [ -f "$MODELS_DIR/punctuation/bpe.vocab" ]; then
      echo "[download-models] OK: Punctuation (English cnn-bilstm)"
    else
      echo "[download-models] INFO: No punctuation model found — using simple multilingual fallback (100+ langs)"
    fi

    if [ "$missing" -eq 1 ]; then
      echo "[download-models] FATAL: required models (turbo or VAD) are missing." >&2
      exit 1
    fi

    echo "=============================================================="
    echo "[download-models] SUCCESS — all models ready in $MODELS_DIR at $(date -Iseconds)"
    echo "=============================================================="

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-service-v2
  namespace: debugging-testcrash-pub
  labels:
    app: whisper-service-v2
spec:
  replicas: 1   # 1 replica of Whisper large-v3-turbo int8 + Silero VAD (streaming low-latency pipeline)
                # Worker container runs the actual sherpa-onnx ASR (NUM_THREADS=2)
                # HPA will scale from 1-3 based on CPU load
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: whisper-service-v2
  template:
    metadata:
      labels:
        app: whisper-service-v2
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
# HTTP API — accepts requests and enqueues jobs to BullMQ/Redis
         - name: whisper-service-v2
           image: harbor.dev.takatan.cloud/devcenter/whisper-service-v2:latest
           ports:
             - containerPort: 8000
           env:
             - name: MODELS_DIR
               value: "/models"
             - name: PORT
               value: "8000"
             - name: REDIS_URL
               value: "redis://redis:6379"
             - name: CACHE_TTL
               value: "3600"
             - name: WAIT_FOR_JOB_MS
               value: "300000"
             - name: NUM_THREADS
               value: "4"
             - name: NUM_INTER_THREADS
               value: "2"
             - name: OMP_NUM_THREADS
               value: "4"
             - name: OMP_WAIT_POLICY
               value: "PASSIVE"
             - name: OPENBLAS_NUM_THREADS
               value: "4"
             - name: MKL_NUM_THREADS
               value: "4"
           # API is relatively light (just enqueues to Redis)
           # OPTIMIZED: Slightly increased for better request handling
           resources:
             requests:
               cpu: "2m"
               memory: "1024Mi"
             limits:
               cpu: "100m"
               memory: "2Gi"
           volumeMounts:
             - name: models
               mountPath: /models
               readOnly: true
           readinessProbe:
             httpGet:
               path: /health
               port: 8000
             initialDelaySeconds: 15
             periodSeconds: 10
             failureThreshold: 6
           livenessProbe:
             httpGet:
               path: /health
               port: 8000
             initialDelaySeconds: 30
             periodSeconds: 15
             failureThreshold: 5

# BullMQ Worker — picks jobs from Redis and runs sherpa-onnx transcription
         - name: whisper-worker-v2
           image: harbor.dev.takatan.cloud/devcenter/whisper-service-v2:latest
           command: ["node", "src/worker.js"]
           env:
             - name: MODELS_DIR
               value: "/models"
             - name: REDIS_URL
               value: "redis://redis:6379"
             - name: CACHE_TTL
               value: "3600"
             - name: NUM_THREADS
               value: "4"
             - name: NUM_INTER_THREADS
               value: "2"
             - name: OMP_NUM_THREADS
               value: "4"
             - name: OMP_WAIT_POLICY
               value: "PASSIVE"
             - name: OPENBLAS_NUM_THREADS
               value: "2"
             - name: MKL_NUM_THREADS
               value: "2"
             - name: GOTO_NUM_THREADS
               value: "1"
             - name: PUNCT_THREADS
               value: "2"
             - name: WAIT_FOR_JOB_MS
               value: "900000"
           # Worker runs the new streaming Whisper turbo int8 + Silero VAD pipeline (segment-by-segment decode, no giant merges)
           # With HPA this will scale; each ready worker needs ~2-4 Gi RAM + 1.5-4 CPU while transcribing
           # OPTIMIZED: Using ~4 cores per pod for ideal scaling
           resources:
             requests:
               cpu: "2500m"
               memory: "4Gi"
             limits:
               cpu: "2800m"
               memory: "5Gi"
           volumeMounts:
             - name: models
               mountPath: /models
               readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: whisper-service-v2-models-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: whisper-service-v2
  namespace: debugging-testcrash-pub
  labels:
    app: whisper-service-v2
spec:
  selector:
    app: whisper-service-v2
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: whisper-service-v2
  namespace: debugging-testcrash-pub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: whisper-service-v2
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # don't scale down too aggressively
    scaleUp:
      stabilizationWindowSeconds: 60

---
# Использование (рекомендуется через kustomize):
# 1. kubectl apply -k kubernetes/overlays/testcrash-pub -n debugging-testcrash-pub
#
# 2. Скачать ASR модели (если ещё не скачано):
#    kubectl create -f kubernetes/base/whisper-service-v2-downloader-job.yaml -n debugging-testcrash-pub
#
# 3. После скачивания моделей поды поднимутся и перевод станет доступен
#    для пользователей, у которых в Dashboard → Profile выбрана Preferred Translation Language.
#
# Сервисы:
#   - ASR:          http://whisper-service-v2.../v1/transcribe-base64

