---
# Whisper Service v2: sherpa-onnx + Silero VAD + CT-Transformer
# CPU-only deployment for debugging-testcrash-pub
#
# Model downloader Job has been moved to a separate file:
#   kubernetes/base/whisper-service-v2-downloader-job.yaml
#
# Reason: Jobs should not be part of regular declarative deploys.
# To download or re-download models run:
#   kubectl create -f kubernetes/base/whisper-service-v2-downloader-job.yaml -n debugging-testcrash-pub


apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whisper-service-v2-models-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: whisper-service-v2-download-scripts
data:
  download-models.sh: |
    #!/bin/sh
    # =============================================================================
    # whisper-service-v2 model downloader (embedded copy — must match scripts/download-models.sh)
    # =============================================================================
    # CRITICAL RULES (per AGENTS.md):
    # - Runs ONLY inside Kubernetes Job + PVC. NEVER on laptop.
    # - Downloads happen at most ONCE (marker files).
    # - Punctuation model is optional; simple fallback covers 100+ languages.
    # =============================================================================
    set -euo pipefail

    echo "=============================================================="
    echo "[download-models] START at $(date -Iseconds)"
    echo "[download-models] MODELS_DIR=${MODELS_DIR:-/models}"
    echo "=============================================================="

    MODELS_DIR="${MODELS_DIR:-/models}"

    mkdir -p "$MODELS_DIR/sense_voice" "$MODELS_DIR/vad" "$MODELS_DIR/punctuation"

    BASE="https://github.com/k2-fsa/sherpa-onnx/releases/download"

    download_if_missing() {
      local url="$1"
      local out="$2"
      if [ -f "$out" ]; then
        echo "[download-models] SKIP (exists): $out"
        return 0
      fi
      echo "[download-models] DOWNLOADING (single): $url → $out"
      if ! curl -L --fail --retry 8 --retry-delay 5 --max-time 300 -o "$out" "$url"; then
        echo "[download-models] FATAL: failed to download $url" >&2
        exit 1
      fi
      echo "[download-models] SUCCESS: $out"
    }

    download_tar_if_missing() {
      local url="$1"
      local dest_dir="$2"
      local marker="$3"
      local name="$4"
      if [ -f "$marker" ]; then
        echo "[download-models] SKIP (exists): $marker  [$name]"
        return 0
      fi
      echo "[download-models] DOWNLOADING ARCHIVE ($name): $url"
      tmp="$(mktemp)"
      if ! curl -L --fail --retry 8 --retry-delay 5 --max-time 600 -o "$tmp" "$url"; then
        echo "[download-models] FATAL: failed to download archive $url" >&2
        rm -f "$tmp"
        exit 1
      fi
      echo "[download-models] EXTRACTING $name ..."
      tar -xjf "$tmp" -C "$dest_dir" --strip-components=1
      rm -f "$tmp"
      echo "[download-models] SUCCESS: $name extracted"
    }

    download_tar_if_missing \
      "${BASE}/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2" \
      "$MODELS_DIR/sense_voice" \
      "$MODELS_DIR/sense_voice/model.int8.onnx" \
      "SenseVoice"

    download_if_missing \
      "${BASE}/asr-models/silero_vad.onnx" \
      "$MODELS_DIR/vad/silero_vad.onnx"

    # Whisper large-v3-turbo download moved to git clone (see earlier section) – old GitHub URLs removed to prevent 404 errors

    echo "[download-models] >>> PUNCTUATION (most fragile) ..."
    download_tar_if_missing \
      "${BASE}/punctuation-models/sherpa-onnx-punct-ct-transformer-zh-en-vocab272727-2024-04-12.tar.bz2" \
      "$MODELS_DIR/punctuation" \
      "$MODELS_DIR/punctuation/model.onnx" \
      "Punctuation"

    echo "[download-models] Verifying ..."
    missing=0

    if [ ! -f "${MODELS_DIR}/whisper/large-v3-turbo-encoder.int8.onnx" ] || [ ! -f "${MODELS_DIR}/whisper/large-v3-turbo-decoder.int8.onnx" ] || [ ! -f "${MODELS_DIR}/whisper/large-v3-turbo-tokens.txt" ]; then
      echo "[download-models] ERROR: Whisper large-v3-turbo.int8 files missing!" >&2
      missing=1
    else
      echo "[download-models] OK: Whisper large-v3-turbo.int8 (best multilingual + LID)"
    fi

    if [ ! -f "$MODELS_DIR/vad/silero_vad.onnx" ]; then
      echo "[download-models] ERROR: VAD missing!" >&2
      missing=1
    else
      echo "[download-models] OK: VAD"
    fi

    if [ ! -f "$MODELS_DIR/punctuation/model.onnx" ] || [ ! -f "$MODELS_DIR/punctuation/vocab.txt" ]; then
      echo "[download-models] INFO: Punctuation model absent — simple multilingual fallback active (100+ langs)"
    else
      echo "[download-models] OK: Punctuation (zh/en bonus)"
    fi

    if [ "$missing" -eq 1 ]; then
      echo "[download-models] FATAL — large-v3-turbo or VAD missing" >&2
      exit 1
    fi

    echo "=============================================================="
    echo "[download-models] SUCCESS at $(date -Iseconds)"
    echo "=============================================================="

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-service-v2
  labels:
    app: whisper-service-v2
spec:
  replicas: 1   # 1 replica for debugging-testcrash-pub (12 CPU quota, ~6.7 CPU already used by other pods)
  selector:
    matchLabels:
      app: whisper-service-v2
  template:
    metadata:
      labels:
        app: whisper-service-v2
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        # HTTP API — accepts requests and enqueues jobs to BullMQ/Redis
        - name: whisper-service-v2
          image: harbor.dev.takatan.cloud/devcenter/whisper-service-v2:latest
          ports:
            - containerPort: 8000
          env:
            - name: MODELS_DIR
              value: "/models"
            - name: PORT
              value: "8000"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: CACHE_TTL
              value: "3600"
            - name: WAIT_FOR_JOB_MS
              value: "300000"   # 5 minutes - large-v3-turbo.int8 first load can take 3-6 min on CPU
            - name: NUM_THREADS
              value: "4"
            - name: NUM_INTER_THREADS
              value: "2"   # API container is lighter
          # API is relatively light (just enqueues to Redis)
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5

        # BullMQ Worker — picks jobs from Redis and runs sherpa-onnx transcription
        - name: whisper-worker-v2
          image: harbor.dev.takatan.cloud/devcenter/whisper-service-v2:latest
          command: ["node", "src/worker.js"]
          env:
            - name: MODELS_DIR
              value: "/models"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: CACHE_TTL
              value: "3600"
            - name: NUM_THREADS
              value: "6"   # tuned for large-v3-turbo.int8 (good balance quality/speed)
            - name: WORKER_CONCURRENCY
              value: "1"
            # Translation is now done via Whisper built-in (task: translate) instead of separate NLLB service
          resources:
            requests:
              cpu: "2"
              memory: "3Gi"
            limits:
              cpu: "3"
              memory: "4Gi"
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: whisper-service-v2-models-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: whisper-service-v2
  labels:
    app: whisper-service-v2
spec:
  selector:
    app: whisper-service-v2
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: whisper-service-v2
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: whisper-service-v2
  minReplicas: 1
  maxReplicas: 2   # keep low to stay under 12 CPU HRQ in debugging-testcrash-pub
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # don't scale down too aggressively
    scaleUp:
      stabilizationWindowSeconds: 60

---
# Использование (рекомендуется через kustomize):
# 1. kubectl apply -k kubernetes/overlays/testcrash-pub -n debugging-testcrash-pub
#
# 2. Скачать ASR модели (если ещё не скачано):
#    kubectl create -f kubernetes/base/whisper-service-v2-downloader-job.yaml -n debugging-testcrash-pub
#
# 3. После скачивания моделей поды поднимутся и перевод станет доступен
#    для пользователей, у которых в Dashboard → Profile выбрана Preferred Translation Language.
#
# Сервисы:
#   - ASR:          http://whisper-service-v2.../v1/transcribe-base64

