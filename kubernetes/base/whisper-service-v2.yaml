---
# Whisper Service v2: sherpa-onnx Whisper large-v3-turbo int8 + Silero VAD
# CPU-only deployment for debugging-testcrash-pub (namespace: debugging-testcrash-pub)
#
# Model downloader Job is in a separate file (Jobs are not declarative):
#   kubectl create -f kubernetes/base/whisper-service-v2-downloader-job.yaml -n debugging-testcrash-pub
#
# This will download ~1.6 GB of models into the PVC on the first run.
# Subsequent runs are instant (marker files).


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper-service-v2
  namespace: debugging-testcrash-pub
  labels:
    app: whisper-service-v2
spec:
  replicas: 2   # 2 replicas of Whisper large-v3-turbo int8 + Silero VAD (streaming low-latency pipeline)
                # Worker container runs the actual sherpa-onnx ASR (NUM_THREADS=2)
                # HPA will scale from 1-3 based on CPU load
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: whisper-service-v2
  template:
    metadata:
      labels:
        app: whisper-service-v2
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        # HTTP API — accepts requests and enqueues jobs to BullMQ/Redis
        - name: whisper-service-v2
          image: harbor.dev.takatan.cloud/azazellosaraksh/whisper-service-v2:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MODELS_DIR
              value: "/models"
            - name: PORT
              value: "8000"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: ASR_MODEL_TYPE
              value: "whisper"
            - name: CACHE_TTL
              value: "3600"
            - name: WAIT_FOR_JOB_MS
              value: "180000"
            - name: NUM_THREADS
              value: "2"
            - name: NUM_INTER_THREADS
              value: "1"
            - name: OMP_NUM_THREADS
              value: "1"
            - name: OMP_WAIT_POLICY
              value: "PASSIVE"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
          # API is relatively light (just enqueues to Redis)
          # OPTIMIZED: Slightly increased for better request handling
          resources:
            requests:
              cpu: "50m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "2Gi"
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

        # BullMQ Worker — picks jobs from Redis and runs sherpa-onnx transcription
        - name: whisper-worker-v2
          image: harbor.dev.takatan.cloud/azazellosaraksh/whisper-service-v2:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "src/worker.js"]
          env:
            - name: MODELS_DIR
              value: "/models"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: ASR_MODEL_TYPE
              value: "whisper"
            - name: CACHE_TTL
              value: "3600"
            - name: NUM_INTER_THREADS
              value: "1"
            - name: OMP_NUM_THREADS
              value: "1"
            - name: OMP_WAIT_POLICY
              value: "PASSIVE"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
            - name: GOTO_NUM_THREADS
              value: "1"
            - name: PUNCT_THREADS
              value: "4"
            - name: WAIT_FOR_JOB_MS
              value: "180000"
            - name: ENABLE_PUNCTUATION
              value: "false"
            - name: VAD_MIN_SPEECH_DURATION
              value: "1.2"
            - name: VAD_MIN_SILENCE_DURATION
              value: "0.5"
            - name: NUM_THREADS
              value: "1"
          # Worker runs the new streaming Whisper turbo int8 + Silero VAD pipeline (segment-by-segment decode, no giant merges)
          # With HPA this will scale; each ready worker needs ~2-4 Gi RAM + 1.5-4 CPU while transcribing
          # OPTIMIZED: Using ~4 cores per pod for ideal scaling
          resources:
            requests:
              cpu: "2500m"
              memory: "4Gi"
            limits:
              cpu: "2800m"
              memory: "5Gi"
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: whisper-service-v2-models-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: whisper-service-v2
  namespace: debugging-testcrash-pub
  labels:
    app: whisper-service-v2
spec:
  selector:
    app: whisper-service-v2
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: whisper-service-v2
  namespace: debugging-testcrash-pub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: whisper-service-v2
  minReplicas: 3
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # don't scale down too aggressively
    scaleUp:
      stabilizationWindowSeconds: 60

---
# Использование (рекомендуется через kustomize):
# 1. kubectl apply -k kubernetes/overlays/testcrash-pub -n debugging-testcrash-pub
#
# 2. Скачать ASR модели (если ещё не скачано):
#    kubectl create -f kubernetes/base/whisper-service-v2-downloader-job.yaml -n debugging-testcrash-pub
#
# 3. После скачивания моделей поды поднимутся и перевод станет доступен
#    для пользователей, у которых в Dashboard → Profile выбрана Preferred Translation Language.
#
# Сервисы:
#   - ASR:          http://whisper-service-v2.../v1/transcribe-base64

