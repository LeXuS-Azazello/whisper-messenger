apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen3-asr-cache
  namespace: debugging-testcrash-cloud
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-asr
  namespace: debugging-testcrash-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen3-asr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: qwen3-asr
    spec:
      containers:
      - name: qwen3-asr
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
          name: ollama
        env:
        - name: OLLAMA_MODEL
          value: "qwen3:0.6b"
        - name: OLLAMA_KEEP_ALIVE
          value: "24h"
        resources:
          requests:
            cpu: "8000m"
            memory: "16Gi"
          limits:
            cpu: "12000m"
            memory: "32Gi"
        volumeMounts:
        - name: cache
          mountPath: /root/.ollama
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: qwen3-asr-cache
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-asr
  namespace: debugging-testcrash-cloud
spec:
  selector:
    app: qwen3-asr
  ports:
  - name: ollama
    port: 11434
    targetPort: 11434
    name: ollama
