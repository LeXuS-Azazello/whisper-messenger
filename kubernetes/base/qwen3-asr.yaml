apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen3-asr-cpu-script
  namespace: debugging-testcrash-pub
data:
  cpu_serve.py: |
    import os
    import tempfile
    import torch
    import uvicorn
    from fastapi import FastAPI, UploadFile, File, Form
    from qwen_asr import Qwen3ASRModel

    app = FastAPI()

    print("Loading Qwen3-ASR model on CPU (Transformers backend)...")
    try:
        model = Qwen3ASRModel.from_pretrained(
            "Qwen/Qwen3-ASR-0.6B",
            dtype=torch.float32,
            device_map="cpu"
        )
        print("Model loaded successfully!")
    except Exception as e:
        print(f"FATAL: Failed to load model: {e}")
        import sys
        sys.exit(1)

    @app.get("/health")
    async def health():
        return {"status": "ok", "model": "Qwen3-ASR-0.6B"}

    @app.post("/v1/audio/transcriptions")
    async def transcribe(file: UploadFile = File(...), model_name: str = Form(default="Qwen/Qwen3-ASR-0.6B"), language: str = Form(default="auto")):
        print(f"Received transcription request: {file.filename}")
        with tempfile.NamedTemporaryFile(delete=False, suffix=".ogg") as tmp:
            tmp.write(await file.read())
            tmp_path = tmp.name

        try:
            results = model.transcribe(audio=[tmp_path])
            if results:
                res = results[0]
                # Qwen3-ASR results are usually objects with .text and .language
                text = getattr(res, "text", str(res))
                print(f"Transcription success: {text[:50]}...")
            else:
                print("Transcription returned no results")
                text = ""
        except Exception as e:
            print(f"Error transcribing: {e}")
            text = ""
        finally:
            if os.path.exists(tmp_path):
                os.remove(tmp_path)

        return {"text": text}
    
    if __name__ == "__main__":
        uvicorn.run(app, host="0.0.0.0", port=8000)

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen3-asr-cache
  namespace: debugging-testcrash-pub
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-asr
  namespace: debugging-testcrash-pub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen3-asr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: qwen3-asr
    spec:
      imagePullSecrets:
      - name: harbor-pull-secret
      containers:
      - name: qwen3-asr
        image: harbor.dev.takatan.cloud/devcenter/python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "Starting qwen3-asr pod..."
          # Install system dependencies for audio processing
          # Use persistent location for packages
          export PYTHONUSERBASE=/root/.cache/python_packages
          export PATH=$PYTHONUSERBASE/bin:$PATH

          # Install dependencies only if not present
          if ! python3 -c "import torch" 2>/dev/null; then
            echo "Installing heavy dependencies (torch, torchaudio)..."
            pip install --user torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          fi
          
          if ! python3 -c "import qwen_asr" 2>/dev/null; then
            echo "Installing ASR dependencies..."
            pip install --user qwen-asr python-multipart uvicorn fastapi
          fi
          
          # Run the server
          python3 /app/cpu_serve.py

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 300
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 600
          periodSeconds: 30
          timeoutSeconds: 10

        ports:
        - containerPort: 8000
          name: http
        env:
        - name: VLLM_TARGET_DEVICE
          value: "cpu"
        - name: CUDA_VISIBLE_DEVICES
          value: ""
        - name: NVIDIA_VISIBLE_DEVICES
          value: "void"
        - name: TRANSFORMERS_VERBOSITY
          value: "info"
        - name: HF_HOME
          value: "/root/.cache/huggingface"
        - name: PYTHONUSERBASE
          value: "/root/.cache/python_packages"
        resources:
          requests:
            cpu: "8000m"
            memory: "8Gi"
          limits:
            cpu: "16000m"
            memory: "16Gi"
        volumeMounts:
        - name: cache
          mountPath: /root/.cache
        - name: script-vol
          mountPath: /app
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: qwen3-asr-cache
      - name: script-vol
        configMap:
          name: qwen3-asr-cpu-script
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-asr
  namespace: debugging-testcrash-pub
spec:
  selector:
    app: qwen3-asr
  ports:
  - name: http
    port: 8000
    targetPort: 8000
