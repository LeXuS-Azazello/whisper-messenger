apiVersion: apps/v1
kind: Deployment
metadata:
  name: tg-client-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tg-client-manager
  template:
    metadata:
      labels:
        app: tg-client-manager
    spec:
      serviceAccountName: tg-client-manager-sa
      imagePullSecrets:
      - name: forgejo-pull-secret
      containers:
      - name: manager
        image: forge.dev.takatan.cloud/lexus/voicemsg-net:tg-client-manager-latest
        imagePullPolicy: Always
        command: ["node", "index.js"]
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: voicemsg-secrets
        env:
        - name: MODE
          value: "MANAGER"
        - name: MANAGER_API_SERVER
          value: "https://kube-api.kube-dc.cloud:6443"
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: TG_API_ID
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: TELEGRAM_APP_ID
        - name: TG_API_HASH
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: TELEGRAM_APP_HASH
        - name: MANAGER_SECRET
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: MANAGER_SECRET
              optional: true
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: MONGODB_URI
          value: "mongodb://mongodb:27017/voicemsg"
        - name: TG_CLIENT_IMAGE
          value: "forge.dev.takatan.cloud/lexus/voicemsg-net:tg-client-latest"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "300m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: tg-client-manager
spec:
  selector:
    app: tg-client-manager
  ports:
  - port: 3000
    targetPort: 3000
