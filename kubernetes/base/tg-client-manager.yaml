apiVersion: apps/v1
kind: Deployment
metadata:
  name: tg-client-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tg-client-manager
  template:
    metadata:
      labels:
        app: tg-client-manager
    spec:
      serviceAccountName: tg-client-manager-sa
      imagePullSecrets:
      - name: harbor-pull-secret
      containers:
      - name: manager
        image: harbor.dev.takatan.cloud/devcenter/whisper-tg-client-manager:latest
        imagePullPolicy: Always
        command: ["node", "index.js"]
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: whisper-messenger-env
        env:
        - name: MODE
          value: "MANAGER"
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: TG_API_ID
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: TELEGRAM_APP_ID
        - name: TG_API_HASH
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: TELEGRAM_APP_HASH
        - name: MANAGER_SECRET
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: MANAGER_SECRET
              optional: true
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: MONGODB_URI
          value: "mongodb://mongodb:27017/voicemsg"
        - name: TG_CLIENT_IMAGE
          value: "harbor.dev.takatan.cloud/devcenter/whisper-tg-client:latest"
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: tg-client-manager
spec:
  selector:
    app: tg-client-manager
  ports:
  - port: 3000
    targetPort: 3000
