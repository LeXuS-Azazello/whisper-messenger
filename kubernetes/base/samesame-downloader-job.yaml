# samesame Model Downloader Job
#
# PURPOSE:
#   One-time (or on-demand) Job that downloads the TTS models
#   (Coqui YourTTS + Vocoder) into the PVC used by the samesame Deployment.
#
# WHEN TO RUN:
#   - First time after deploying samesame
#   - If models are missing or corrupted
#   - After changing the download script
#
# USAGE (IMPORTANT):
#   This file uses `generateName`, therefore you MUST use `create`, not `apply`.
#
#   Correct command:
#   kubectl create -f kubernetes/base/samesame-downloader-job.yaml -n debugging-testcrash-pub
#
#   Why not `apply`?
#   `kubectl apply` does not support `generateName`. Every time you want to re-download
#   the models, run `create` again — it will create a fresh Job.
#
#   To watch logs:
#   kubectl logs -f job/<generated-name> -n debugging-testcrash-pub
#
#   Example job name:
#   samesame-model-downloader-8f3k9
#
# NOTES:
#   - This Job is intentionally NOT part of the regular base kustomization.
#   - Regular deploys (deploy.sh / kubectl apply -k) will NOT recreate it.
#   - The actual download logic lives in the ConfigMap "samesame-download-scripts"
#     created by samesame.yaml (calls python /app/download_model.py).
#   - The Job is safe to run multiple times (the python script handles idempotency).
#

apiVersion: batch/v1
kind: Job
metadata:
  generateName: samesame-model-downloader-
  namespace: debugging-testcrash-pub
  labels:
    app: samesame
    component: model-downloader
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: samesame
        component: model-downloader
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: downloader
          image: harbor.dev.takatan.cloud/devcenter/samesame:latest
          command: ["/bin/sh", "-c", "/scripts/download-models.sh"]
          env:
            - name: MODELS_DIR
              value: "/models"
            - name: HUGGINGFACE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: HUGGING_FACE_HUB_TOKEN
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: HUGGING_FACE_HUB_TOKEN
            - name: DOWNLOAD_TIMEOUT
              value: "1800"
            - name: SAMESAME_MODEL_NAME
              value: "FunAudioLLM/CosyVoice-300M"
            - name: COQUI_TOS_AGREED
              value: "1"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: scripts
              mountPath: /scripts
          resources:
            # Increased resources for reliable download
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: samesame-model-cache
        - name: scripts
          configMap:
            name: samesame-download-scripts
            defaultMode: 0755
