# samesame Model Downloader Job
# One-time (or on-demand) Job that downloads the TTS models into the PVC used by the samesame Deployment.
apiVersion: batch/v1
kind: Job
metadata:
  name: samesame-model-downloader
  namespace: debugging-testcrash-pub
  labels:
    app: samesame
    component: model-downloader
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: samesame
        component: model-downloader
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: forgejo-pull-secret
      containers:
        - name: downloader
          image: forge.dev.takatan.cloud/lexus/voicemsg-net:samesame-latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c", "/scripts/download-models.sh"]
          env:
            - name: MODELS_DIR
              value: "/models"
            - name: HUGGINGFACE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: token
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: token
            - name: DOWNLOAD_TIMEOUT
              value: "1800"
            - name: SAMESAME_MODEL_NAME
              value: "FunAudioLLM/Fun-CosyVoice3-0.5B-2512"
            - name: MODELSCOPE_CACHE
              value: "/models"
            - name: HF_HOME
              value: "/models"
            - name: COQUI_TOS_AGREED
              value: "1"
            - name: MODELSCOPE_TOKEN
              value: "ms-3183349c-0a5f-4d6d-9d3e-b44646d0ea7e"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: samesame-model-cache
        - name: scripts
          configMap:
            name: samesame-download-scripts
            defaultMode: 0755