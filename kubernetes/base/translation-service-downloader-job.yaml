# translation-service Model Downloader Job
#
# PURPOSE:
#   One-time Job that:
#     1. Downloads facebook/nllb-200-distilled-600M from Hugging Face
#     2. Converts it to CTranslate2 INT8 format (optimized for fast CPU inference)
#     3. Stores the result on the dedicated PVC
#
# WHEN TO RUN:
#   - First time after deploying translation-service
#   - If you want to re-download / re-convert the model
#   - After updating the conversion script
#
# USAGE (IMPORTANT — same rules as whisper downloader):
#   This file uses `generateName`, therefore you MUST use `create`, **not** `apply`.
#
#   Correct command:
#     kubectl create -f kubernetes/base/translation-service-downloader-job.yaml \
#                    -n debugging-testcrash-pub
#
#   To watch progress:
#     kubectl logs -f job/<job-name> -n debugging-testcrash-pub
#
#   Example job name:
#     translation-service-model-downloader-7x9k2
#
# NOTES:
#   - The Job is intentionally NOT part of kustomize base.
#   - Regular deploys (`kubectl apply -k ...`) will never recreate it.
#   - The script uses a marker file (.ready) so it is safe to run multiple times.
#   - Conversion can take 15-40 minutes on first run (depends on CPU in the node).
#   - Requires ~4-5 GiB temporary disk during conversion.

apiVersion: batch/v1
kind: Job
metadata:
  generateName: translation-service-model-downloader-
  namespace: debugging-testcrash-pub
  labels:
    app: translation-service
    component: model-downloader
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: translation-service
        component: model-downloader
    spec:
      restartPolicy: OnFailure
      containers:
        - name: downloader
          image: python:3.12-slim
          command: ["/bin/bash", "/scripts/download-translation-model.sh"]
          env:
            - name: HF_HOME
              value: "/models/translation/hf-cache"
            - name: CT2_MODEL_DIR
              value: "/models/translation/ct2/nllb-200-distilled-600M-int8"
            - name: NLLB_MODEL
              value: "facebook/nllb-200-distilled-600M"
          volumeMounts:
            - name: models
              mountPath: /models
            - name: scripts
              mountPath: /scripts
          resources:
            # Reduced for debugging-testcrash-pub 12 CPU HRQ
            requests:
              cpu: "800m"
              memory: "2Gi"
            limits:
              cpu: "1"
              memory: "4Gi"
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: translation-service-models-pvc
        - name: scripts
          configMap:
            name: translation-service-download-scripts
            defaultMode: 0755
