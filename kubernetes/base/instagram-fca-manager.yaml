apiVersion: v1
kind: ConfigMap
metadata:
  name: insta-fca-pod-template
data:
  pod-template.json: |
    {
      "apiVersion": "v1",
      "kind": "Pod",
      "metadata": {
        "name": "insta-user",
        "labels": {
          "app": "instagram-fca-client",
          "userId": "PLACEHOLDER"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "instagram-fca-client",
            "image": "harbor.dev.takatan.cloud/azazellosaraksh/instagram-fca-client:latest",
            "imagePullPolicy": "IfNotPresent",
              "env": [
                {
                  "name": "FUNASR_URL",
                  "value": "http://funasr.debugging-testcrash-pub.svc.cluster.local:50001/v1/transcribe-base64"
                },
                {
                  "name": "WHISPER_SECRET",
                  "valueFrom": {
                    "secretKeyRef": {
                      "name": "voicemsg-secrets",
                      "key": "MANAGER_SECRET"
                    }
                  }
                },
                {
                  "name": "MANAGER_URL",
                  "value": "http://instagram-fca-manager:3005"
                },
                {
                  "name": "SECRET",
                  "valueFrom": {
                    "secretKeyRef": {
                      "name": "voicemsg-secrets",
                      "key": "MANAGER_SECRET"
                    }
                  }
                },
                {
                  "name": "REDIS_URL",
                  "value": "redis://redis:6379"
                }
              ],
              "resources": {
                "requests": {
                  "cpu": "200m",
                  "memory": "256Mi"
                },
                "limits": {
                  "cpu": "1",
                  "memory": "1Gi"
                }
              }
          }
        ],
        "imagePullSecrets": [
          {
            "name": "harbor-pull-secret"
          }
        ],
        "restartPolicy": "Never"
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: instagram-fca-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: instagram-fca-manager
  template:
    metadata:
      labels:
        app: instagram-fca-manager
    spec:
      serviceAccountName: voicemsg-client-manager
      imagePullSecrets:
      - name: harbor-pull-secret
      containers:
      - name: manager
        image: harbor.dev.takatan.cloud/azazellosaraksh/instagram-fca-manager:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3005
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "2Gi"
        env:
        - name: MODE
          value: "MANAGER"
        - name: PORT
          value: "3005"
        - name: SECRET
          valueFrom:
            secretKeyRef:
              name: voicemsg-secrets
              key: MANAGER_SECRET
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: MONGODB_URI
          value: "mongodb://mongodb:27017/voicemsg"
---
apiVersion: v1
kind: Service
metadata:
  name: instagram-fca-manager
spec:
  selector:
    app: instagram-fca-manager
  ports:
  - port: 3005
    targetPort: 3005