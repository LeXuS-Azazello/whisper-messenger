---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-whisper-config
  namespace: debugging-echovoice
data:
  config.yaml: |
    ingress:
      - hostname: whisper-api.debug.org.ua
        service: http://sherpa-onnx:8000
      - service: http://localhost:8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-whisper
  namespace: debugging-echovoice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared-whisper
  template:
    metadata:
      labels:
        app: cloudflared-whisper
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --config
        - /etc/cloudflared/config.yaml
        - run
        - --token
        - eyJhIjoiZmZhMjc2NTFhNjQ3ZDM3YTcxZmIzYWVhZTk2OWM3NjIiLCJ0IjoiYTIxZmRkMDItMmUxNi00ZWVlLWEwY2YtM2ZlNWZhODM1YmI4IiwicyI6Ik9EWmxaREl6TnprdE4yUmhaQzAwTXpBekxXSXhOemt0WVRjeE4yRmxNemc0WW1WaCJ9
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: config
        configMap:
          name: cloudflared-whisper-config
---
