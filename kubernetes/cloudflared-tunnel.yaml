      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: debugging-testcrash-cloud
  labels:
    app: cloudflared
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: cloudflared
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
        - tunnel
        - --no-autoupdate
        - --config
        - /etc/cloudflared/config/config.yaml
        - run
        ports:
        - name: metrics
          containerPort: 20241
        volumeMounts:
        - name: tunnel-creds
          mountPath: /etc/cloudflared/credentials
          readOnly: true
        - name: tunnel-config
          mountPath: /etc/cloudflared/config
          readOnly: true
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /ready
            port: 20241
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 20241
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: tunnel-creds
        secret:
          secretName: cloudflared-tunnel-credentials
      - name: tunnel-config
        configMap:
          name: cloudflared-config
---
apiVersion: v1
kind: Service
metadata:
  name: cloudflared-metrics
  namespace: debugging-testcrash-cloud
spec:
  type: ClusterIP
  selector:
    app: cloudflared
  ports:
  - name: metrics
    port: 20243
    targetPort: 20241