# Cloudflared tunnel - runs inside the K8s cluster to proxy traffic
# from Cloudflare edge to internal services
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-tunnel-credentials
  namespace: debugging-testcrash-cloud
type: Opaque
# s field must be base64-encoded as cloudflared expects
stringData:
  credentials.json: |
    {"a":"ffa27651a647d37a71fb3aeae969c762","s":"ZWYjYWQxOWdFdFlXWTFaaTAwTkdJeExXSmxaVE10T1RZNU5HVmxPREExWmpNMCJ9","t":"965dcbfb-e458-4acc-8900-816ad881cd01"}
---
# ConfigMap with cloudflared ingress rules
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: debugging-testcrash-cloud
data:
   config.yaml: |
     tunnel: 965dcbfe-4458-4acc-8900-816ad881cd01
     token: eyJhIjoiZmZhMjc2NTFhNjQ3ZDM3YTcxZmIzYWVhZTk2OWM3NjIiLCJ0IjoiOTY1ZGNiZmUtNDQ1OC00YWNjLTg5MDAtODE2YWQ4ODFjZDAxIiwicyI6IlpXTmpZV1ExT1dFdFlXWTFaaTAwTkdJeExXSmxaVE10T1RZNU5HVmxPREExWmpNMCJ9

     ingress:
      - hostname: voicemsg.net
        service: http://echo-frontend.debugging-testcrash-cloud.svc.cluster.local:80
        originRequest:
          connectTimeout: 30s
          tlsTimeout: 10s
          httpHostHeader: voicemsg.net
      - hostname: bridge.voicemsg.net
        service: http://mtproto-bridge-manager.debugging-testcrash-cloud.svc.cluster.local:3000
        originRequest:
          connectTimeout: 30s
          httpHostHeader: bridge.voicemsg.net
          noTLSVerify: true
      - hostname: asr.voicemsg.net
        service: http://qwen3-asr.debugging-testcrash-cloud.svc.cluster.local:11434
        originRequest:
          connectTimeout: 120s
          httpHostHeader: asr.voicemsg.net
          noTLSVerify: true
      - hostname: grafana.voicemsg.net
        service: http://grafana.debugging-testcrash-cloud.svc.cluster.local:3000
