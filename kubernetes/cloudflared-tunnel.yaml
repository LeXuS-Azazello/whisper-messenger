apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-tunnel-token
  namespace: debugging-echovoice
type: Opaque
stringData:
  token: "eyJhIjoiZmZhMjc2NTFhNjQ3ZDM3YTcxZmIzYWVhZTk2OWM3NjIiLCJ0IjoiODg1ZWFkYzUtZDlmMS00NDc0LWIzOWEtZmQ0M2Y3Zjc4N2RjIiwicyI6Ik16UmxOVE0zT0RVdFlXSTJZeTAwTTJNeExUZzNOV1V0WWpWbE5XUTNOekpsT1dOaCJ9"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-tunnel
  namespace: debugging-echovoice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared-tunnel
  template:
    metadata:
      labels:
        app: cloudflared-tunnel
    spec:
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:latest
        args:
          - tunnel
          - --no-autoupdate
          - run
          - --token
          - $(CLOUDFLARED_TOKEN)
        env:
        - name: CLOUDFLARED_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflared-tunnel-token
              key: token
        resources:
          limits:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cloudflared-tunnel-service
  namespace: debugging-echovoice
spec:
  type: ClusterIP
  selector:
    app: cloudflared-tunnel
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
