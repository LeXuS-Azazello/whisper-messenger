apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen3-asr-cache
  namespace: debugging-testcrash-pub
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-asr
  namespace: debugging-testcrash-pub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen3-asr
  template:
    metadata:
      labels:
        app: qwen3-asr
    spec:
      containers:
      - name: qwen3-asr
        image: qwenllm/qwen3-asr:latest
        ports:
        - containerPort: 80
          name: http
        - containerPort: 50051
          name: grpc
        env:
        - name: MODEL_NAME
          value: "Qwen/Qwen3-ASR-0.6B"
        resources:
          requests:
            cpu: "8000m"
            memory: "16Gi"
          limits:
            cpu: "12000m"
            memory: "32Gi"
        volumeMounts:
        - name: cache
          mountPath: /data/shared/Qwen3-ASR
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: qwen3-asr-cache
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-asr
  namespace: debugging-testcrash-pub
spec:
  selector:
    app: qwen3-asr
  ports:
  - port: 80
    targetPort: 80
    name: http
  - port: 50051
    targetPort: 50051
    name: grpc