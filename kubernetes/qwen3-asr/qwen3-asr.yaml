apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-asr
  namespace: debugging-echovoice
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen3-asr
  template:
    metadata:
      labels:
        app: qwen3-asr
    spec:
      containers:
      - name: qwen3-asr
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        env:
        - name: OLLAMA_HOST
          value: "0.0.0.0:11434"
        volumeMounts:
        - name: qwen3-asr-data
          mountPath: /root/.ollama
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Starting Ollama server..."
          ollama serve &
          sleep 5
          echo "Pulling Qwen2.5 model..."
          ollama pull qwen2.5 || echo "Model pull failed, continuing..."
          echo "Qwen3-ASR service ready"
          wait
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
      volumes:
      - name: qwen3-asr-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-asr
  namespace: debugging-echovoice
spec:
  selector:
    app: qwen3-asr
  ports:
  - port: 11434
    targetPort: 11434
  type: ClusterIP