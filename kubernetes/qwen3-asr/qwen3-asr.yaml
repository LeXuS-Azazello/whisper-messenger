apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen3-asr-cache
  namespace: debugging-echovoice
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-asr
  namespace: debugging-echovoice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen3-asr
  template:
    metadata:
      labels:
        app: qwen3-asr
    spec:
      containers:
      - name: qwen3-asr
        image: azazellosaraksh/qwen3-asr:latest
        ports:
        - containerPort: 11434
        env:
        - name: MODEL_NAME
          value: "Qwen/Qwen3-ASR-0.6B"
        - name: TRANSFORMERS_CACHE
          value: "/root/.cache"
        - name: HF_HOME
          value: "/root/.cache"
        - name: HF_HUB_CACHE
          value: "/root/.cache/hub"
        volumeMounts:
        - name: qwen3-asr-data
          mountPath: /root/.cache
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        startupProbe:
          httpGet:
            path: /health
            port: 11434
          # Give it 10 minutes (60 * 10s) to download the model on first run
          failureThreshold: 60
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 11434
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 11434
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: qwen3-asr-data
        persistentVolumeClaim:
          claimName: qwen3-asr-cache
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-asr
  namespace: debugging-echovoice
spec:
  selector:
    app: qwen3-asr
  ports:
  - port: 11434
    targetPort: 11434
  type: ClusterIP