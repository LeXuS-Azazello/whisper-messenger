apiVersion: batch/v1
kind: Job
metadata:
  name: funasr-model-downloader
  namespace: debugging-testcrash-pub
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: funasr
        component: model-downloader
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: harbor-pull-secret  # Указываем секрет для Harbor
      containers:
        - name: downloader
          image: harbor.dev.takatan.cloud/azazellosaraksh/funasr:latest
          command: ["/bin/sh", "-c", "python /app/download_model.py /models"]
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: token
          volumeMounts:
            - name: models
              mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: funasr-model-pvc
