apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namespace: debugging-testcrash-cloud

patches:
- target:
    kind: Ingress
    name: voicemsg-ingress
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: testcrash-cloud.voicemsg.net

# Exclude heavy qwen3-asr during testing
# resources:
# - ../../qwen3-asr  # Uncomment when ready to deploy ASR