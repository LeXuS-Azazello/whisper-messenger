name = "whisper-messenger"
main = "src/index.ts"
compatibility_date = "2026-02-13"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "whisper.debug.org.ua/*", zone_name = "debug.org.ua" }
]

[ai]
binding = "AI"

[[queues.producers]]
binding = "AUDIO_QUEUE"
queue = "audio-jobs"

[[kv_namespaces]]
binding = "STATS"
id = "f4b04260ccfa4f1ea34c4fab2d53ed1d"

[[queues.consumers]]
queue = "audio-jobs"
max_batch_size = 1
max_retries = 5

[vars]
META_API_VERSION = "v19.0"
WHATSAPP_PHONE_NUMBER_ID = "956619407541550"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[[rules]]
type = "Text"
globs = ["**/*.css"]
fallthrough = true