---
# ══════════════════════════════════════════════════════════════════════════════
# Translation Service — NLLB-200-distilled-600M (Meta AI)
# 200+ языков, CTranslate2 INT8, ~300MB модель, полностью offline
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: translation-service
  namespace: debugging-testcrash-pub
  labels:
    app: translation-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: translation-service
  template:
    metadata:
      labels:
        app: translation-service
    spec:
      containers:
        - name: translation
          image: harbor.dev.takatan.cloud/devcenter/translation-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: MODEL_PATH
              value: "/hf-cache/facebook/nllb-200-distilled-600M"
            - name: HF_HOME
              value: "/hf-cache"
            - name: NUM_THREADS
              value: "4"
            - name: INTER_THREADS
              value: "2"
          resources:
            requests:
              memory: "512Mi"
              cpu: "1"
            limits:
              memory: "1500Mi"  # модель ~300MB, рабочая память ~500MB
              cpu: "4"
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: translation-service
  namespace: debugging-testcrash-pub
  labels:
    app: translation-service
spec:
  selector:
    app: translation-service
  ports:
    - name: http
      port: 8001
      targetPort: 8001
  type: ClusterIP

# ══════════════════════════════════════════════════════════════════════════════
# КАК ИСПОЛЬЗОВАТЬ:
#
# Из любого клиента (fb/wa/tg/insta) — добавить параметр target_language:
#
# POST /v1/transcribe-base64
# {
#   "file_data": "<base64>",
#   "mime_type": "audio/ogg",
#   "language": "auto",
#   "target_language": "eng_Latn"   ← добавить это поле
# }
#
# Клиент сначала транскрибирует через ASR, потом автоматически
# вызывает translation-service и возвращает оба текста:
# {
#   "text": "Привет, как дела?",          ← оригинал
#   "translated": "Hello, how are you?",  ← перевод
#   "language": "rus_Cyrl",
#   "target_language": "eng_Latn"
# }
#
# Коды языков (передавать в target_language):
#   rus_Cyrl  — Русский
#   eng_Latn  — English
#   zho_Hans  — 中文
#   deu_Latn  — Deutsch
#   fra_Latn  — Français
#   ukr_Cyrl  — Українська
#   arb_Arab  — العربية
#   jpn_Jpan  — 日本語
#   kor_Hang  — 한국어
#   (полный список: GET http://translation-service:8001/v1/languages)
# ══════════════════════════════════════════════════════════════════════════════
