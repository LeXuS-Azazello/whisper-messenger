apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: whisper-service-exec
  namespace: debugging-testcrash-pub
rules:
  - apiGroups: [""]
    resources:
      - pods/exec
    verbs:
      - create
      - get
      - list
      - watch
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: whisper-service-exec-binding
  namespace: debugging-testcrash-pub
subjects:
  - kind: User
    name: debugging:debugging@debug.org.ua
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: whisper-service-exec
  apiGroup: rbac.authorization.k8s.io
