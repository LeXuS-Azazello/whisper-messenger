# Cloudflared tunnel configuration for echo-messenger
# Routes voicemsg.net traffic to the Kubernetes cluster

tunnel: 9dc709ab-af10-4c4c-8227-d5066909a67c
credentials-file: /root/.cloudflared/credentials.json

ingress:
  # Main frontend - voice messenger web app
  - hostname: voicemsg.net
    service: http://echo-frontend.debugging-testcrash-cloud.svc.cluster.local:80
    originRequest:
      connectTimeout: 30s
      tlsTimeout: 10s
      httpHostHeader: voicemsg.net

  # MTProto Bridge Manager
  - hostname: bridge.voicemsg.net
    service: http://mtproto-bridge-manager.debugging-testcrash-cloud.svc.cluster.local:3000
    originRequest:
      connectTimeout: 30s
      httpHostHeader: bridge.voicemsg.net
      noTLSVerify: true

  # Qwen3 ASR (Ollama)
  - hostname: asr.voicemsg.net
    service: http://qwen3-asr.debugging-testcrash-cloud.svc.cluster.local:11434
    originRequest:
      connectTimeout: 120s
      httpHostHeader: asr.voicemsg.net
      noTLSVerify: true

  # Grafana dashboard
  - hostname: grafana.voicemsg.net
    service: http://grafana.debugging-testcrash-cloud.svc.cluster.local:3000
    originRequest:
      connectTimeout: 30s
      httpHostHeader: grafana.voicemsg.net
      noTLSVerify: true

  # Catch-all - return 404
  - service: http_status:404