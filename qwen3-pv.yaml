apiVersion: v1
kind: PersistentVolume
metadata:
  name: qwen3-asr-pv
  namespace: debugging-echovoice
spec:
  capacity:
    storage: 50Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/data/qwen3-asr
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen3-asr-cache
  namespace: debugging-echovoice
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: manual
  volumeMode: Filesystem
