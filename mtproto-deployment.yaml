apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtproto-bridge-manager
  namespace: debugging-testcrash-pub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mtproto-bridge-manager
  template:
    metadata:
      labels:
        app: mtproto-bridge-manager
    spec:
      serviceAccountName: mtproto-bridge-sa
      imagePullSecrets:
      - name: harbor-pull-secret
      containers:
      - name: mtproto-bridge
        image: harbor.dev.takatan.cloud/debugging/whisper-bridge-manager:latest
        ports:
        - containerPort: 3000
        env:
        - name: MODE
          value: "MANAGER"
        - name: TG_API_ID
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: TELEGRAM_APP_ID
        - name: TG_API_HASH
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: TELEGRAM_APP_HASH
        - name: BRIDGE_SECRET
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: BRIDGE_SECRET
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: QWEN_ASR_URL
          value: "http://qwen3-asr:11434"
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"