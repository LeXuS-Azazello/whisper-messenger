# CLOUDFLARED TUNNEL
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-tunnel-token
  namespace: debugging-echovoice
  labels:
    app: echo-messenger
type: Opaque
