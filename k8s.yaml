# =============================================================================
# ECHO MESSENGER - KUBERNETES INFRASTRUCTURE CONFIGURATION
# =============================================================================
# Domain: voicemsg.net
# Environment: Production (debugging-echovoice namespace)
# Architecture: Cloudflare Workers + Kubernetes (MTProto Bridge + Whisper ASR)
# =============================================================================

# -----------------------------------------------------------------------------
# SERVICE ACCOUNT & RBAC
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mtproto-bridge-sa
  namespace: debugging-echovoice
  labels:
    app: echo-messenger
    component: bridge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-manager-role
  namespace: debugging-echovoice
  labels:
    app: echo-messenger
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "delete", "patch"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: [""]
  resources: ["services", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mtproto-bridge-rb
  namespace: debugging-echovoice
  labels:
    app: echo-messenger
subjects:
- kind: ServiceAccount
  name: mtproto-bridge-sa
  namespace: debugging-echovoice
roleRef:
  kind: Role
  name: pod-manager-role
  apiGroup: rbac.authorization.k8s.io

# -----------------------------------------------------------------------------
# REDIS - Session Management & Caching
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: debugging-echovoice
  labels:
    app: echo-messenger
    component: redis
spec:
  selector:
    app: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: debugging-echovoice
  labels:
    app: echo-messenger
data:
  redis.conf: |
    maxmemory 512mb
    maxmemory-policy allkeys-lru
    save 900 1
    save 300 10
    save 60 10000
    tcp-keepalive 300
    timeout 0
    tcp-backlog 511
    databases 16
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: debugging-echovoice
  labels:
    app: redis
    component: cache
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
          protocol: TCP
        command:
        - redis-server
        - /usr/local/etc/redis/redis.conf
        volumeMounts:
        - name: redis-config
          mountPath: /usr/local/etc/redis/redis.conf
          subPath: redis.conf
        - name: redis-data
          mountPath: /data
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
      volumes:
      - name: redis-config
        configMap:
          name: redis-config
          items:
          - key: redis.conf
            path: redis.conf
      - name: redis-data
        emptyDir: {}

# -----------------------------------------------------------------------------
# QWEN3-ASR - Voice Transcription Engine (Heavy Model)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: qwen3-asr
  namespace: debugging-echovoice
  labels:
    app: echo-messenger
    component: asr
spec:
  selector:
    app: qwen3-asr
  ports:
  - name: http
    port: 11434
    targetPort: 11434
    protocol: TCP
  - name: grpc
    port: 11435
    targetPort: 11435
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen3-asr-pvc
  namespace: debugging-echovoice
  labels:
    app: echo-messenger
    component: asr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: default
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-asr
  namespace: debugging-echovoice
  labels:
    app: qwen3-asr
    component: asr
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qwen3-asr
  template:
    metadata:
      labels:
        app: qwen3-asr
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
          name: http
          protocol: TCP
        - containerPort: 11435
          name: grpc
          protocol: TCP
        env:
        - name: OLLAMA_KEEP_ALIVE
          value: "3600"
        - name: OLLAMA_MAX_LOADED_MODELS
          value: "1"
        - name: OLLAMA_NUM_PARALLEL
          value: "1"
        - name: OLLAMA_MODELS
          value: "/root/.ollama/models"
        - name: OLLAMA_DEBUG
          value: "1"
        volumeMounts:
        - name: qwen3-asr-storage
          mountPath: /root/.ollama
        - name: qwen3-asr-pvc
          mountPath: /models
        resources:
          requests:
            cpu: "4"
            memory: "16Gi"
          limits:
            cpu: "12"
            memory: "32Gi"
        livenessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
        startupProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 30
      volumes:
      - name: qwen3-asr-storage
        emptyDir: {}
      - name: qwen3-asr-pvc
        persistentVolumeClaim:
          claimName: qwen3-asr-pvc

# -----------------------------------------------------------------------------
# MTPROTO BRIDGE MANAGER - Orchestrates User Pods
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtproto-bridge-manager
  namespace: debugging-echovoice
  labels:
    app: echo-messenger
    component: bridge-manager
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mtproto-bridge-manager
  template:
    metadata:
      labels:
        app: mtproto-bridge-manager
    spec:
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/os: linux
      serviceAccountName: mtproto-bridge-sa
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: bridge
        image: azazellosaraksh/debugging-mtproto-bridge:v2
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: MODE
          value: "MANAGER"
        - name: TG_API_ID
          value: "13867088"
        - name: TG_API_HASH
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: TELEGRAM_APP_HASH
              optional: false
        - name: BRIDGE_SECRET
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: BRIDGE_SECRET
              optional: false
        - name: WORKER_URL
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: WORKER_URL
              optional: false
        - name: QWEN_ASR_URL
          value: "http://qwen3-asr:11434"
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: BRIDGE_IMAGE
          value: azazellosaraksh/debugging-mtproto-bridge:v2
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: DEVICE_MODEL
          value: "MTProto Bridge Manager"
        - name: APP_VERSION
          value: "2.0.0"
        - name: SYSTEM_VERSION
          value: "Kubernetes"
        - name: LOG_LEVEL
          value: "info"
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: mtproto-bridge-manager
  namespace: debugging-echovoice
  labels:
    app: echo-messenger
    component: bridge-manager
spec:
  selector:
    app: mtproto-bridge-manager
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
  type: ClusterIP

# -----------------------------------------------------------------------------
# USER POD TEMPLATE (Spawned Dynamically by Manager)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-pod-template
  namespace: debugging-echovoice
  labels:
    app: echo-messenger
data:
  pod-template.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      labels:
        app: tg-user-bridge
    spec:
      containers:
      - name: bridge
        image: azazellosaraksh/debugging-mtproto-bridge:v2
        env:
        - name: MODE
          value: "USER"
        - name: DEVICE_MODEL
          value: "MTProto User Bridge"
        - name: APP_VERSION
          value: "2.0.0"
        - name: SYSTEM_VERSION
          value: "Kubernetes"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10

# -----------------------------------------------------------------------------
# INGRESS - External Access via Cloudflare
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mtproto-bridge-ingress
  namespace: debugging-echovoice
  labels:
    app: echo-messenger
  annotations:
    # Core settings
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/use-regex: "true"
    
    # Body size & timeout
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    
    # SSL/TLS (Cloudflare handles SSL, backend uses HTTP)
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    
    # Rate limiting (optional, can be adjusted)
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    
    # WebSocket support (for real-time features)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    
    # Security headers (Cloudflare adds most)
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Real-IP $remote_addr";
      more_set_headers "X-Forwarded-For $proxy_add_x_forwarded_for";
spec:
  ingressClassName: nginx
  rules:
  - host: bridge.voicemsg.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mtproto-bridge-manager
            port:
              number: 3000

# -----------------------------------------------------------------------------
# NETWORK POLICY - Pod Isolation
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mtproto-bridge-network-policy
  namespace: debugging-echovoice
  labels:
    app: echo-messenger
spec:
  podSelector:
    matchLabels:
      app: tg-user-bridge
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: mtproto-bridge-manager
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: qwen3-asr
    ports:
    - protocol: TCP
      port: 11434
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80

# -----------------------------------------------------------------------------
# FRONTEND DEPLOYMENT - Web UI
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-frontend
  namespace: debugging-echovoice
  labels:
    app: echo-messenger
    component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: echo-frontend
  template:
    metadata:
      labels:
        app: echo-frontend
    spec:
      containers:
      - name: frontend
        image: azazellosaraksh/echo-frontend:latest
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "3000"
        - name: API_BASE_URL
          value: "https://voicemsg.net"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: echo-frontend
  namespace: debugging-echovoice
  labels:
    app: echo-messenger
    component: frontend
spec:
  selector:
    app: echo-frontend
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  - name: https
    port: 443
    targetPort: 3000
    protocol: TCP
  type: ClusterIP

