# =============================================================================
# ECHO MESSENGER - KUBERNETES CONFIGURATION
# =============================================================================
# Namespace: debugging-echovoice
# =============================================================================

# -----------------------------------------------------------------------------
# REDIS
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: debugging-echovoice
  labels:
    app: echo-messenger
    component: redis
spec:
  selector:
    app: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: debugging-echovoice
  labels:
    app: echo-messenger
data:
  redis.conf: |
    maxmemory 128mb
    maxmemory-policy allkeys-lru
    save ""
    tcp-keepalive 300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: debugging-echovoice
  labels:
    app: redis
    component: cache
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        command:
        - redis-server
        - /usr/local/etc/redis/redis.conf
        volumeMounts:
        - name: redis-config
          mountPath: /usr/local/etc/redis/redis.conf
          subPath: redis.conf
        resources:
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "100m"
            memory: "256Mi"
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 15
          periodSeconds: 20
      volumes:
      - name: redis-config
        configMap:
          name: redis-config
          items:
          - key: redis.conf
            path: redis.conf

# -----------------------------------------------------------------------------
# QWEN3-ASR
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: qwen3-asr
  namespace: debugging-echovoice
  labels:
    app: echo-messenger
    component: asr
spec:
  selector:
    app: qwen3-asr
  ports:
  - name: http
    port: 11434
    targetPort: 11434
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen3-asr-pvc
  namespace: debugging-echovoice
  labels:
    app: echo-messenger
    component: asr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: default
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-asr
  namespace: debugging-echovoice
  labels:
    app: qwen3-asr
    component: asr
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: qwen3-asr
  template:
    metadata:
      labels:
        app: qwen3-asr
    spec:
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
          name: http
          protocol: TCP
        env:
        - name: OLLAMA_KEEP_ALIVE
          value: "3600"
        - name: OLLAMA_MAX_LOADED_MODELS
          value: "1"
        volumeMounts:
        - name: qwen3-asr-pvc
          mountPath: /models
        resources:
          requests:
            cpu: "1000m"
            memory: "4Gi"
          limits:
            cpu: "3000m"
            memory: "8Gi"
        livenessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 60
          periodSeconds: 30
        startupProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 30
      volumes:
      - name: qwen3-asr-pvc
        persistentVolumeClaim:
          claimName: qwen3-asr-pvc

# -----------------------------------------------------------------------------
# MTPROTO BRIDGE MANAGER
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtproto-bridge-manager
  namespace: debugging-echovoice
  labels:
    app: echo-messenger
    component: bridge-manager
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: mtproto-bridge-manager
  template:
    metadata:
      labels:
        app: mtproto-bridge-manager
    spec:
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/os: linux
      serviceAccountName: mtproto-bridge-sa
      containers:
      - name: bridge
        image: azazellosaraksh/debugging-mtproto-bridge:v2
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: MODE
          value: "MANAGER"
        - name: TG_API_ID
          value: "13867088"
        - name: TG_API_HASH
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: TELEGRAM_APP_HASH
        - name: BRIDGE_SECRET
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: BRIDGE_SECRET
        - name: WORKER_URL
          valueFrom:
            secretKeyRef:
              name: whisper-messenger-env
              key: WORKER_URL
        - name: QWEN_ASR_URL
          value: "http://qwen3-asr:11434"
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mtproto-bridge-manager
  namespace: debugging-echovoice
  labels:
    app: echo-messenger
    component: bridge-manager
spec:
  selector:
    app: mtproto-bridge-manager
  ports:
  - name: http
    port: 3000
    targetPort: 3000
  type: ClusterIP

# -----------------------------------------------------------------------------
# INGRESS
# -----------------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mtproto-bridge-ingress
  namespace: debugging-echovoice
  labels:
    app: echo-messenger
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
  - host: bridge.voicemsg.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mtproto-bridge-manager
            port:
              number: 3000

# -----------------------------------------------------------------------------

