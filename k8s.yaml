              name: cloudflared-tunnel-token
              key: token
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        livenessProbe:
          exec:
            command:
            - wget
            - --spider
            - -q
            - http://localhost:8080/ready
          initialDelaySeconds: 15
          periodSeconds: 30

---
