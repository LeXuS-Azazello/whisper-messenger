  namespace: debugging-echovoice
  labels:
    app: echo-messenger
type: Opaque
stringData:
  token: "eyJhIjoiZmZhMjc2NTFhNjQ3ZDM3YTcxZmIzYWVhZTk2OWM3NjIiLCJ0IjoiODg1ZWFkYzUtZDlmMS00NDc0LWIzOWEtZmQ0M2Y3Zjc4N2RjIiwicyI6Ik16UmxOVE0zT0RVdFlXSTJZeTAwTTJNeExUZzNOV1V0WWpVbE5XUTNOekpsT1dOaCJ9"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-tunnel
  namespace: debugging-echovoice
  labels:
    app: echo-messenger
    component: tunnel
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
